<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mein Kochbuch</title>
<meta name="theme-color" content="#f6f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161413" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kochbuch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<style>
:root{--bg:#f6f2ec;--card:#fff;--soft:#f1ebe3;--ink:#26211d;--mute:#7d736a;--acc:#d9622b;--acc2:#fbe6d9;--line:#e7dfd4;--ok:#2f8a55;--ok2:#dff3e6;--shadow:0 1px 2px rgba(60,40,20,.06),0 6px 18px rgba(60,40,20,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#161413;--card:#211e1c;--soft:#2a2623;--ink:#f3ede6;--mute:#a0968c;--acc:#f0814a;--acc2:#42291c;--line:#34302c;--ok:#6cc088;--ok2:#1d3326;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.sm,nav .ico{display:none}
.wrap{max-width:1120px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 0 10px}
h1{margin:0;font-size:22px;letter-spacing:-.02em;flex:1;white-space:nowrap}
h2{letter-spacing:-.01em}
.step{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.step .box{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{width:30px;height:32px;border:0;background:none;color:var(--ink);font-size:17px;cursor:pointer}
.step button:hover{background:var(--soft)}
.step b{min-width:26px;text-align:center;color:var(--ink);font-size:15px}
nav{display:flex;gap:6px;padding-bottom:12px;overflow-x:auto}
nav button{display:flex;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap}
nav button:hover{background:var(--soft)}
nav button.on{background:var(--ink);color:var(--bg)}
nav .cnt{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--mute)}
nav button.on .cnt{background:color-mix(in srgb,var(--bg) 22%,transparent);color:var(--bg)}
nav .plus{order:9;margin-left:auto;background:var(--acc);color:#fff;gap:6px}
nav .plus:hover{background:var(--acc);filter:brightness(1.07)}
/* Profil */
.prof{display:flex;align-items:center;gap:18px;margin:4px 0 18px}
.ava{width:76px;height:76px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:38px;background:linear-gradient(135deg,#ec7a40,#c94f1c);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--acc)}
.prof h2{margin:0 0 8px;font-size:20px}
.stats{display:flex;gap:22px}
.stats div{text-align:center;line-height:1.2}
.stats b{display:block;font-size:18px}
.stats span{font-size:12px;color:var(--mute)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel h3{margin:12px 0 2px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.set{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.panel h3 + .set{border-top:0}
.set .t{flex:1;min-width:0}
.set .t small{display:block;color:var(--mute);font-size:12.5px}
.set .step b{min-width:30px}
.panel > p{margin:10px 0 14px}
.inline-step{margin-left:auto}
main{padding-top:20px;padding-bottom:60px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
input:focus,textarea:focus{outline:2px solid var(--acc2);border-color:var(--acc)}
textarea{width:100%;min-height:110px;background:var(--bg)}
button.b{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
button.g{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font:inherit;cursor:pointer}
button.b:hover{filter:brightness(1.07)} button.g:hover{background:var(--soft)}
button.ic{width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.mute{color:var(--mute);font-size:13px}
.tools{margin-bottom:12px}
.tools #q{flex:1;min-width:180px;max-width:340px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip:hover{color:var(--ink)} .chip.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2),var(--shadow)}
.pic{height:104px;display:grid;place-items:center;font-size:46px;position:relative;background:linear-gradient(135deg,hsl(var(--h) 70% 90%),hsl(calc(var(--h) + 25) 75% 82%))}
@media (prefers-color-scheme:dark){.pic{background:linear-gradient(135deg,hsl(var(--h) 35% 22%),hsl(calc(var(--h) + 25) 40% 16%))}}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pic .in{position:absolute;top:10px;right:10px;background:var(--acc);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.body{padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{margin:0;font-size:16px;line-height:1.25;letter-spacing:-.01em}
.meta{display:flex;gap:12px;color:var(--mute);font-size:13px}
.tag{display:inline-block;background:var(--soft);color:var(--mute);border-radius:999px;padding:2px 9px;font-size:12px;margin:0 4px 4px 0}
.card .info{display:flex;flex-direction:column;gap:8px}
.card .act{margin-top:auto;padding-top:6px}
.card .act button{width:100%}
button.picked{background:var(--ok2);color:var(--ok);border:0}
.sec{display:flex;align-items:baseline;gap:10px;margin:0 0 4px}
.sec h2{margin:0;font-size:20px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:10px 0 20px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .25s}
.bar.full i{background:var(--ok)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.slot{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.slot.lock{border-color:var(--acc)}
.slot.extra{border-style:dashed}
.slot .em{width:56px;height:56px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,hsl(var(--h) 70% 90%),hsl(calc(var(--h) + 25) 75% 82%))}
@media (prefers-color-scheme:dark){.slot .em{background:linear-gradient(135deg,hsl(var(--h) 35% 24%),hsl(calc(var(--h) + 25) 40% 17%))}}
.slot .txt{flex:1;min-width:0;cursor:pointer}
.slot .txt b{display:block;line-height:1.25}
.slot .no{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.slot.empty{border-style:dashed;box-shadow:none;background:none;color:var(--mute);cursor:pointer;min-height:82px}
.slot.empty:hover{border-color:var(--acc);color:var(--acc)}
.slot.empty .em{background:var(--soft);font-size:22px}
.aisles{columns:2 340px;column-gap:16px}
.aisle{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px 8px;margin-bottom:16px;box-shadow:var(--shadow)}
.aisle h3{margin:10px 0 4px;font-size:14px;display:flex;justify-content:space-between}
.aisle h3 span{color:var(--mute);font-weight:500;font-size:12px}
ul.clean{list-style:none;margin:0;padding:0}
.shop li{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.shop li.done .t,.shop li.done .amt{text-decoration:line-through;color:var(--mute)}
.shop li.done{opacity:.6}
.shop input{width:20px;height:20px;accent-color:var(--ok);flex:none;margin:0}
.shop .t{flex:1;min-width:0}
.shop .t small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);max-width:600px;width:calc(100% - 24px);padding:0;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog .pad{padding:20px}
dialog .pic{height:130px;font-size:60px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.ing{columns:2 200px;column-gap:24px;margin:10px 0 0;padding:0;list-style:none}
.ing li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);break-inside:avoid}
.ing li b{min-width:74px}
.steps{white-space:pre-wrap;line-height:1.6}
.empty{text-align:center;color:var(--mute);padding:50px 10px}
.empty .big{font-size:44px;display:block;margin-bottom:8px}
dialog{overflow:auto}
.x{position:sticky;top:10px;float:right;margin:10px 10px -46px 0;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:color-mix(in srgb,var(--card) 85%,transparent);color:var(--ink);font-size:16px;cursor:pointer;box-shadow:var(--shadow)}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;margin:12px 0}
@media (hover:none){.card:hover{transform:none;border-color:var(--line)}.card.sel:hover{border-color:var(--acc)}}

/* ---------- Handy ---------- */
@media (max-width:700px){
  .wrap{padding:0 14px}
  .lg,.desk{display:none!important}
  .sm{display:inline}
  header{position:static;backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .step{font-size:13px;gap:6px}
  .step button{width:34px;height:36px}
  /* Tableiste unten wie in einer App */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:10;gap:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));overflow:visible;background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  nav button{flex:1;flex-direction:column;gap:2px;padding:5px 2px 3px;border-radius:12px;font-size:11px;position:relative}
  nav button:hover{background:none}
  nav button.on{background:none;color:var(--acc)}
  nav .ico{display:block;width:26px;height:26px}
  nav .cnt{position:absolute;top:0;left:calc(50% + 6px);font-size:10px;line-height:16px;padding:0 6px;min-width:18px;text-align:center}
  nav button.on .cnt{background:var(--acc);color:#fff}
  nav .plus{order:0;margin:0;background:none;color:#fff;justify-content:center}
  nav .plus:hover{filter:none}
  nav .plus .pl{width:50px;height:38px;border-radius:13px;background:var(--acc);display:grid;place-items:center;font-size:28px;font-weight:400;line-height:1;box-shadow:0 4px 12px color-mix(in srgb,var(--acc) 40%,transparent)}
  nav .plus:active .pl{transform:scale(.94)}
  .inline-step{flex-basis:100%;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 4px 4px 14px;margin:6px 0 2px;font-size:14px;color:var(--ink)}
  .inline-step .box{border:0}
  .inline-step ~ button{flex:1}
  .prof{gap:16px}
  .ava{width:68px;height:68px;font-size:34px}
  .stats{gap:18px}
  h1{font-size:22px}
  .top{padding:12px 0 8px}
  main{padding-top:14px;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  input,textarea,select{font-size:16px}
  button.b,button.g{padding:10px 14px}
  button.ic{width:40px;height:40px;padding:0}
  .tools{flex-wrap:nowrap}
  .tools #q{min-width:0;max-width:none;padding:10px 12px}
  .tools .sp{display:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -14px 14px;padding:0 14px 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:7px 14px}
  /* Rezepte als Liste */
  .grid{grid-template-columns:1fr;gap:10px}
  .card{flex-direction:row;border-radius:14px}
  .card .pic{width:78px;height:auto;min-height:80px;font-size:34px;flex:none}
  .card .pic .in{display:none}
  .card .body{flex-direction:row;align-items:center;gap:10px;padding:10px 10px 10px 12px}
  .card .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .card h3{font-size:15.5px}
  .card .tags{white-space:nowrap;overflow:hidden;mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .card .tag{margin-bottom:0}
  .card .act{margin:0;padding:0}
  .card .act button{width:44px;height:44px;border-radius:50%;padding:0;font-size:20px;line-height:1}
  /* Wochenplan */
  .sec{flex-basis:100%;flex-wrap:wrap;gap:2px 10px}
  .slots{grid-template-columns:1fr;gap:10px}
  .slot{padding:10px;gap:8px}
  .slot .em{width:46px;height:46px;font-size:24px;border-radius:12px}
  .slot.empty{min-height:68px}
  /* Einkaufsliste */
  .aisle{padding:4px 14px 6px;margin-bottom:12px}
  .shop li{padding:12px 0}
  .shop input{width:24px;height:24px}
  /* Dialoge als Blatt von unten */
  dialog{max-width:none;width:100%;max-height:calc(100dvh - 20px);margin:auto 0 0;border-radius:20px 20px 0 0;border-width:1px 0 0}
  dialog .pad{padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  dialog .pic{height:120px}
  .ing{columns:1}
  .acts{gap:8px}
  .acts .sp,.acts .cl{display:none}
  .acts .main{order:-1;flex-basis:100%;padding:13px}
  .acts button{flex:1}
}
@media print{header,.noprint{display:none!important}.aisle{box-shadow:none}body{background:#fff}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <h1>🍳 Mein Kochbuch</h1>
  </div>
  <nav>
    <button data-tab="recipes"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 8h7M9 11.5h5"/></svg>Rezepte <span class="cnt" id="c1"></span></button>
    <button data-tab="plan"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M8.5 15l2.2 2.2L15.5 13"/></svg><span class="lg">Wochenplan</span><span class="sm">Woche</span> <span class="cnt" id="c2"></span></button>
    <button class="plus" id="add" aria-label="Neues Rezept"><span class="pl">+</span><span class="lg">Neues Rezept</span></button>
    <button data-tab="shop"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3.5h2.6l2.3 11.2a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.2l1.6-6.8H6.2"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg><span class="lg">Einkaufsliste</span><span class="sm">Einkauf</span> <span class="cnt" id="c3"></span></button>
    <button data-tab="me"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Profil</button>
  </nav>
</div></header>
<main id="view" class="wrap"></main>

<dialog id="dlg"></dialog>
<script>
/* ---------- Beispielrezepte (werden nur beim ersten Start geladen) ---------- */
const SEED = [
  {name:"Brokkoli-Käse-Sahne-Sauce",portions:4,tags:["Sauce","vegetarisch möglich"],ingredients:[["Zwiebel",2,"Stk"],["Lauch",1,"Stk"],["Schinkenwürfel / Kochschinken",150,"g"],["Knoblauchzehe",1,"Stk"],["Butter",20,"g"],["Light Sahne",2,"Flasche"],["Frischkäse (oder Schmand)",2,"EL"],["Brokkoli (TK)",500,"g"],["Streukäse (optional)",100,"g"]],steps:"Zwiebeln, Lauch, Schinkenwürfel oder Kochschinken und 1 gepresste Knoblauchzehe in Butter anbraten.\nMit 2 Flaschen Light Sahne und 2 EL Frischkäse (oder Schmand) kurz aufkochen.\nWürzen: Salz, Pfeffer, Muskat, Maggi, Fondor, (Brühe).\nBrokkoli (TK) ca. 10 Minuten in die Mikrowelle geben, dann in kleine Röschen schneiden und in die Sauce geben. Kurz aufkochen lassen.\n(Eventuell etwas Streukäse dazu.)"},
  {name:"Kartoffelsuppe",portions:4,tags:["Suppe","vegetarisch"],ingredients:[["Kartoffel",9,"Stk"],["Zucchini",1,"Stk"],["Zwiebel",2,"Stk"],["Lauch",0.5,"Stk"],["Gemüsebrühwürfel",2,"Stk"],["Saure Sahne (oder Schmand)",1,"Becher"]],steps:"Ca. 8-10 Kartoffeln schälen und in Würfel schneiden. 1 Zucchini in Würfel, 1-2 Zwiebeln in Würfel, 1/2 Stange Lauch in Ringe schneiden.\nIn einem Topf mit Wasser + Salz + 2 Gemüsebrühwürfeln aufkochen lassen und ca. 25-30 Minuten kochen.\nGewürze (Salz, Pfeffer) + 1 Becher Saure Sahne oder Schmand dazu, vom Herd nehmen und pürieren.\n\nZucchini kann auch durch anderes Gemüse ersetzt oder weggelassen werden."},
  {name:"Linsen-Bolognese",portions:2,tags:["Pasta","vegetarisch"],ingredients:[["Spaghetti",200,"g"],["Zwiebel",0.5,"Stk"],["Knoblauchzehe",1,"Stk"],["Karotte",2,"Stk"],["Rote Linsen",100,"g"],["Gemüsebrühe",250,"ml"],["Tomatenmark",4,"EL"],["Passierte Tomaten",400,"ml"],["Sojasoße",2,"EL"],["Apfelessig",1,"EL"],["Joghurt / Crème fraîche",2,"EL"],["Zucker / Ahornsirup",1,"TL"]],steps:"Gewürze: Oregano, Paprikagewürz, Kurkuma, Zimt, Salz + Pfeffer.\n\nLinsen waschen, Karotten, Zwiebel, Knoblauch klein schneiden.\nKarotten, Zwiebel, Knoblauch mit Öl andünsten.\nLinsen dazu, kurz andünsten, dann Gemüsebrühe dazu (8 Minuten kochen lassen).\nTomatenmark, Oregano, Kurkuma dazu.\nSpaghetti in Topf (nach Anweisung) kochen.\nPassierte Tomaten, Sojasoße, Essig, Joghurt, Zucker, Paprikapulver zur Soße. Kochen lassen.\nSalz + Pfeffer."},
  {name:"Nudelsalat",portions:6,tags:["Salat","kalt","Feier"],ingredients:[["Miracel Whip",0.5,"Glas"],["Senf",1,"EL"],["Gemüsebrühe",1,"TL"],["Nudeln",500,"g"],["Lyoner",0.25,"Ring"],["Saure Gurken",1,"Glas"]],steps:"Soße: 1/2 Glas Miracel Whip, 1 EL Senf, Gurkenbrühe (aus dem Gurkenglas), 1 TL Gemüsebrühe, Kräuter + Gewürze (Pfeffer, Salz, Maggi, 1/2 Salatkrönung Gartenkräuter).\n500 g Nudeln, 1/4 Ring Lyoner, saure Gurken."},
  {name:"Rindfleischsuppe",portions:8,tags:["Suppe","Feier"],ingredients:[["Rindfleisch (Suppenfleisch)",1,"kg"],["Suppengrün",1,"Bund"],["Suppennudeln",200,"g"]],steps:"Besser geht es im Schnellkochtopf.\n\nTopf mit Wasser zum Kochen bringen, mit Fleisch und etwas Salz 1-2 Stunden köcheln (geschlossener Deckel, niedrige Stufe). Dann Suppengrün dazugeben und 20-30 Min. kochen lassen. Nach einer halben Stunde mit Maggi, Brühwürfel, Muskat, Pfeffer, Fondor würzen.\nNudeln dazugeben und bei geöffnetem Deckel ca. 10 Minuten kochen lassen. Fleisch + Suppengrün herausnehmen.\nFür mehrere Personen (Feier)."},

const UNITS = {g:["g",1],kg:["g",1000],ml:["ml",1],l:["ml",1000],cl:["ml",10]};
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9);
const load = (k,d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d } catch { return d } };
const save = () => { try { localStorage.setItem("kb2", JSON.stringify(S)) } catch {} };

let S = load("kb2", null) || {
  recipes: SEED.map(r => ({...r, id: uid(), ingredients: r.ingredients.map(([name,qty,unit]) => ({name,qty,unit}))})),
  days: 3, people: 4, plan: [], locked: [], checked: {}
};
/* neue Rezepte aus der Datei nachladen, ohne gelöschte oder bearbeitete zu überschreiben */
S.seen ||= S.recipes.map(r => r.name);
for (const r of SEED) if (!S.seen.includes(r.name)) {
  S.seen.push(r.name);
  S.recipes.push({...r, id: uid(), ingredients: r.ingredients.map(([name,qty,unit]) => ({name,qty,unit}))});
}
/* geänderte Rezepte aus der Datei übernehmen (höhere rev), außer selbst bearbeitete */
for (const r of SEED) {
  const x = S.recipes.find(x => x.name === r.name);
  if (x && r.rev && (x.rev || 0) < r.rev && !x.edited)
    Object.assign(x, r, {ingredients: r.ingredients.map(([name,qty,unit]) => ({name,qty,unit}))});
}
save();
let tab = "recipes", filterTag = "", search = "";

/* ---------- Hilfsfunktionen ---------- */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byId = id => S.recipes.find(r => r.id === id);
const num = v => { v = String(v).trim().replace(",", "."); if (v.includes("/")) { const [a,b] = v.split("/"); return a/b } return parseFloat(v) };
function fmt(qty, unit){
  if (unit === "g" && qty >= 1000) { qty /= 1000; unit = "kg" }
  if (unit === "ml" && qty >= 1000) { qty /= 1000; unit = "l" }
  qty = Math.round(qty * 100) / 100;
  return (qty ? String(qty).replace(".", ",") : "") + (unit ? " " + unit : "");
}
/* "200 g Nudeln" / "1/2 Zwiebel" / "Salz" -> Objekt */
function parseLine(line){
  line = line.trim(); if (!line) return null;
  const m = line.match(/^([\d.,\/]+)\s*([A-Za-zäöüÄÖÜ.]+)?\s+(.+)$/) || line.match(/^([\d.,\/]+)\s*()(.+)$/);
  if (!m) return {name: line, qty: 0, unit: ""};
  let [, q, u, name] = m; u = u || "";
  const known = /^(g|kg|ml|l|cl|el|tl|stk|stk\.|dose|dosen|pck|pck\.|packung|bund|prise|zehe|zehen|scheibe|scheiben|becher|glas)$/i;
  if (u && !known.test(u)) { name = u + " " + name; u = "" }
  const l = u.toLowerCase();
  if (l === "el" || l === "tl") u = l.toUpperCase();
  else if (/^stk/.test(l)) u = "Stk";
  else if (UNITS[l]) u = l;
  return {name: name.trim(), qty: num(q), unit: u};
}
const ingText = i => (i.qty ? fmt(i.qty, i.unit) + " " : "") + i.name;

/* ---------- Plan-Logik ---------- */
function randomize(){
  const keep = S.plan.filter(id => S.locked.includes(id) && byId(id));
  let pool = S.recipes.map(r => r.id).filter(id => !keep.includes(id));
  const need = Math.max(0, S.days - keep.length);
  const picked = [];
  while (picked.length < need && pool.length) picked.push(pool.splice(Math.floor(Math.random()*pool.length), 1)[0]);
  // zu wenige Rezepte: wiederholen erlaubt, aber erst nachdem alle einmal dran waren
  while (picked.length < need && S.recipes.length) picked.push(S.recipes[Math.floor(Math.random()*S.recipes.length)].id);
  S.plan = [...keep, ...picked]; S.checked = {}; save();
}
function togglePlan(id){
  if (S.plan.includes(id)) { S.plan = S.plan.filter(x => x !== id); S.locked = S.locked.filter(x => x !== id) }
  else S.plan.push(id);
  S.checked = {}; save();
}
function shopping(){
  const map = {};
  for (const id of S.plan) {
    const r = byId(id); if (!r) continue;
    const f = S.people / (r.portions || 1);
    for (const i of r.ingredients) {
      let qty = (i.qty || 0) * f, unit = i.unit || "";
      const u = UNITS[unit.toLowerCase()]; if (u) { qty *= u[1]; unit = u[0] }
      const key = i.name.trim().toLowerCase() + "|" + unit;
      (map[key] ||= {name: i.name.trim(), unit, qty: 0, from: []});
      map[key].qty += qty; map[key].from.push(r.name);
    }
  }
  return Object.entries(map).map(([key, v]) => ({key, ...v})).sort((a,b) => a.name.localeCompare(b.name, "de"));
}

/* ---------- Rendering ---------- */
function render(){
  document.querySelectorAll("nav [data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const items = shopping();
  $("#c1").textContent = S.recipes.length;
  $("#c2").textContent = `${S.plan.length}/${S.days}`;
  $("#c3").textContent = items.filter(i => !S.checked[i.key]).length;
  ({recipes: vRecipes, plan: vPlan, shop: vShop, me: vMe})[tab]();
}
/* Plus/Minus-Regler für Kochtage und Personen */
const stepper = k => `<div class="step"><div class="box"><button data-set="${k}" data-d="-1" aria-label="weniger">−</button><b>${S[k]}</b><button data-set="${k}" data-d="1" aria-label="mehr">+</button></div></div>`;

/* Symbol + Farbton je Gericht, abgeleitet aus Kategorien und Name */
const LOOKS = [[/suppe/,"🍲",28],[/pasta|spaghetti|nudel/,"🍝",12],[/salat/,"🥗",110],[/bowl/,"🥙",40],[/hähnchen|chicken/,"🍗",35],[/reis/,"🍚",190],[/auflauf|pie/,"🥘",20],[/hack/,"🥩",0],[/sauce|brokkoli/,"🥦",130],[/spinat|vegetarisch/,"🥬",140],[/süß|pfannkuchen/,"🥞",45]];
function look(r){
  const s = (r.name + " " + (r.tags||[]).join(" ")).toLowerCase();
  const l = LOOKS.find(([re]) => re.test(s));
  return l ? {em: l[1], h: l[2]} : {em: "🍽️", h: 30};
}
const pic = (r, extra = "") => { const l = look(r); return `<div class="pic" style="--h:${l.h}">${r.img ? `<img src="${r.img}" alt="">` : l.em}${extra}</div>` };

function vRecipes(){
  const tags = [...new Set(S.recipes.flatMap(r => r.tags || []))].sort((a,b) => a.localeCompare(b, "de"));
  $("#view").innerHTML = `
    <div class="row tools noprint">
      <input id="q" type="search" placeholder="🔍  Rezept suchen…" value="${esc(search)}" autocomplete="off">
    </div>
    <div class="chips noprint"><button class="chip ${filterTag ? "" : "on"}" data-tag="">Alle</button>${tags.map(t => `<button class="chip ${t===filterTag?"on":""}" data-tag="${esc(t)}">${esc(t)}</button>`).join("")}</div>
    <div id="list"></div>`;
  /* beim Tippen nur die Liste neu zeichnen, damit die Tastatur offen bleibt */
  $("#q").oninput = e => { search = e.target.value; vList() };
  document.querySelectorAll("[data-tag]").forEach(b => b.onclick = () => { filterTag = b.dataset.tag; vRecipes() });
  vList();
}
function vList(){
  const list = S.recipes.filter(r => (!filterTag || (r.tags||[]).includes(filterTag)) && r.name.toLowerCase().includes(search.toLowerCase()));
  $("#list").innerHTML = list.length ? `<div class="grid">${list.map(card).join("")}</div>` : `<div class="empty"><span class="big">🤷</span>Keine Rezepte gefunden.</div>`;
  document.querySelectorAll("#list [data-pick]").forEach(b => b.onclick = e => { e.stopPropagation(); togglePlan(b.dataset.pick); render() });
  document.querySelectorAll("#list .card[data-open]").forEach(c => c.onclick = () => detail(c.dataset.open));
}
function card(r){
  const sel = S.plan.includes(r.id);
  return `<div class="card ${sel?"sel":""}" data-open="${r.id}">
    ${pic(r, sel ? `<span class="in">✓ Diese Woche</span>` : "")}
    <div class="body"><div class="info"><h3>${esc(r.name)}</h3>
    <div class="meta"><span>🧺 ${r.ingredients.length} Zutaten</span><span>👤 ${r.portions}</span></div>
    <div class="tags">${(r.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div></div>
    <div class="act noprint"><button class="${sel?"b picked":"b"}" data-pick="${r.id}" aria-label="${sel ? "Aus der Woche entfernen" : "In die Woche"}"><span class="lg">${sel ? "✓ Eingeplant – entfernen" : "+ In die Woche"}</span><span class="sm">${sel ? "✓" : "+"}</span></button></div></div></div>`;
}

function vPlan(){
  const items = S.plan.map(byId).filter(Boolean), n = items.length;
  const empty = Math.max(0, S.days - n);
  const msg = !n ? "Noch nichts geplant" : n < S.days ? `Noch ${S.days - n} offen` : n > S.days ? `${n - S.days} mehr als geplant` : "Woche ist komplett 🎉";
  $("#view").innerHTML = `
    <div class="row noprint">
      <div class="sec sp"><h2>Diese Woche</h2><span class="mute">${n} von ${S.days} Gerichten · ${msg}</span></div>
      <div class="step inline-step noprint"><span>Kochtage</span>${stepper("days")}</div>
      <button class="g" id="clear">Leeren</button>
      <button class="b" id="roll">🎲 Zufällig würfeln</button>
    </div>
    <div class="bar ${n >= S.days ? "full" : ""}"><i style="width:${Math.min(100, n / S.days * 100)}%"></i></div>
    <div class="slots">${items.map((r,i) => { const l = look(r), lk = S.locked.includes(r.id); return `
      <div class="slot ${lk ? "lock" : ""} ${i >= S.days ? "extra" : ""}">
        <div class="em" style="--h:${l.h}">${l.em}</div>
        <div class="txt" data-open="${r.id}"><span class="no">Gericht ${i+1}${lk ? " · fixiert" : ""}</span><b>${esc(r.name)}</b><span class="mute">${r.ingredients.length} Zutaten</span></div>
        <button class="g ic noprint" data-lock="${r.id}" title="${lk ? "Fixierung lösen" : "Fixieren – bleibt beim Würfeln erhalten"}">${lk ? "🔒" : "🔓"}</button>
        <button class="g ic noprint" data-reroll="${r.id}" title="Nur dieses Gericht neu würfeln">🎲</button>
        <button class="g ic noprint" data-pick="${r.id}" title="Entfernen">✕</button>
      </div>`}).join("")}
      ${Array.from({length: empty}, (_, i) => `<div class="slot empty noprint" data-go><div class="em">＋</div><div><span class="no" style="color:inherit">Gericht ${n+i+1}</span><br>Rezept auswählen</div></div>`).join("")}
    </div>
    <p class="mute noprint" style="margin-top:18px">🔒 Fixierte Gerichte bleiben beim Würfeln erhalten, der Rest wird neu gezogen.</p>`;
  $("#roll").onclick = () => { if (!S.recipes.length) return alert("Erst Rezepte anlegen."); randomize(); render() };
  $("#clear").onclick = () => { S.plan = []; S.locked = []; S.checked = {}; save(); render() };
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { tab = "recipes"; render() });
  document.querySelectorAll("[data-lock]").forEach(b => b.onclick = () => { const id = b.dataset.lock; S.locked = S.locked.includes(id) ? S.locked.filter(x => x!==id) : [...S.locked, id]; save(); render() });
  document.querySelectorAll("[data-reroll]").forEach(b => b.onclick = () => {
    const id = b.dataset.reroll, pool = S.recipes.map(r => r.id).filter(x => !S.plan.includes(x));
    if (!pool.length) return alert("Keine weiteren Rezepte zum Tauschen vorhanden.");
    S.plan[S.plan.indexOf(id)] = pool[Math.floor(Math.random()*pool.length)]; S.locked = S.locked.filter(x => x!==id); S.checked = {}; save(); render() });
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { togglePlan(b.dataset.pick); render() });
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => detail(b.dataset.open));
}

/* Einkaufsliste nach Supermarkt-Bereichen; Reihenfolge der Prüfung: erste passende Regel gewinnt */
const AISLES = [
  ["🥫 Konserven, Saucen & Würze", /passierte|tomatenmark|brüh|soja|senf|ketchup|miracel|essig|öl\b|öl |honig|balsamico|worcester|sriracha|röstzwiebel|gurke|rotwein|zucker|currypaste|kokosmilch|kichererbsen/],
  ["🥩 Fleisch & Wurst", /hack|hähnchen|fleisch|schinken|lyoner|wurst/],
  ["🧀 Milch, Käse & Eier", /sahne|käse|feta|parmesan|cheddar|milch|butter|joghurt|skyr|crème|creme|schmand|^ei\b/],
  ["🍝 Nudeln, Reis & Trockenes", /spaghetti|nudel|reis|linsen|brot|walnüsse|nüsse|mehl/],
  ["🥬 Gemüse & Obst", /kartoffel|zwiebel|lauch|porree|knoblauch|karotte|tomate|paprika|zucchini|brokkoli|spinat|salat|bohnen|erbsen|granatapfel|basilikum|schnittlauch|suppengrün/]
];
const AISLE_ORDER = [4, 1, 2, 3, 0, 5];
const aisleOf = name => { const n = name.toLowerCase(), i = AISLES.findIndex(([, re]) => re.test(n)); return i < 0 ? 5 : i };

function vShop(){
  const items = shopping(), done = items.filter(i => S.checked[i.key]).length;
  const groups = AISLE_ORDER.map(a => ({title: a === 5 ? "🛒 Sonstiges" : AISLES[a][0], list: items.filter(i => aisleOf(i.name) === a)})).filter(g => g.list.length);
  $("#view").innerHTML = `
    <div class="row">
      <div class="sec sp"><h2>Einkaufsliste</h2><span class="mute">${S.plan.length} Gerichte${items.length ? ` · ${done} von ${items.length} erledigt` : ""}</span></div>
      <div class="step inline-step noprint"><span>Personen</span>${stepper("people")}</div>
      ${items.length ? `<button class="g noprint" id="reset">Haken entfernen</button>${navigator.share ? `<button class="g noprint" id="share">Teilen</button>` : ""}<button class="g noprint" id="copy">Kopieren</button><button class="g noprint desk" onclick="print()">Drucken</button>` : ""}
    </div>
    ${items.length ? `<div class="bar ${done === items.length ? "full" : ""}"><i style="width:${done / items.length * 100}%"></i></div>
    <div class="aisles shop">${groups.map(g => `<div class="aisle"><h3>${g.title}<span>${g.list.filter(i => !S.checked[i.key]).length} offen</span></h3><ul class="clean">${g.list.map(i => `
      <li class="${S.checked[i.key] ? "done" : ""}" data-k="${esc(i.key)}"><input type="checkbox" ${S.checked[i.key] ? "checked" : ""}>
      <span class="t">${esc(i.name)}<small>${[...new Set(i.from)].map(esc).join(", ")}</small></span>
      <span class="amt">${i.qty ? fmt(i.qty, i.unit) : (i.unit || "")}</span></li>`).join("")}</ul></div>`).join("")}</div>`
      : `<div class="empty"><span class="big">🛒</span>Die Einkaufsliste erscheint, sobald Gerichte im Wochenplan stehen.</div>`}`;
  document.querySelectorAll("li[data-k]").forEach(li => li.onclick = () => { S.checked[li.dataset.k] = !S.checked[li.dataset.k]; save(); render() });
  if (!items.length) return;
  $("#reset").onclick = () => { S.checked = {}; save(); render() };
  /* nur noch nicht abgehakte Zutaten weitergeben */
  const text = () => groups.map(g => [g.title, g.list.filter(i => !S.checked[i.key])]).filter(([, l]) => l.length)
    .map(([t, l]) => t + "\n" + l.map(i => `- ${i.qty ? fmt(i.qty,i.unit)+" " : ""}${i.name}`).join("\n")).join("\n\n");
  const cp = $("#copy"); cp.onclick = () => navigator.clipboard.writeText(text()).then(() => cp.textContent = "Kopiert ✓");
  if ($("#share")) $("#share").onclick = () => navigator.share({title: "Einkaufsliste", text: "Einkaufsliste\n\n" + text()}).catch(() => {});
}

/* ---------- Dialoge ---------- */
function detail(id){
  const r = byId(id), f = S.people / (r.portions || 1), sel = S.plan.includes(id);
  $("#dlg").innerHTML = `<button class="x" id="x" aria-label="Schließen">✕</button>${pic(r)}<div class="pad">
    <h2 style="margin:0 0 6px">${esc(r.name)}</h2>
    <div>${(r.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
    <h4 style="margin:16px 0 0">Zutaten <span class="mute" style="font-weight:400">für ${S.people} Person${S.people === 1 ? "" : "en"} (Rezept: ${r.portions})</span></h4>
    <ul class="ing">${r.ingredients.map(i => `<li><b>${i.qty ? fmt(i.qty*f, i.unit) : (i.unit || "–")}</b><span>${esc(i.name)}</span></li>`).join("")}</ul>
    ${r.steps ? `<h4 style="margin:18px 0 6px">Zubereitung</h4><div class="steps">${esc(r.steps)}</div>` : ""}
    <div class="row acts" style="margin-top:20px"><button class="g" id="del">Löschen</button><button class="g" id="ed">Bearbeiten</button><span class="sp"></span><button class="g cl" id="cl">Schließen</button><button class="b main ${sel ? "picked" : ""}" id="pk">${sel ? "✓ Eingeplant – entfernen" : "+ In die Woche"}</button></div></div>`;
  openDlg();
  $("#cl").onclick = $("#x").onclick = () => $("#dlg").close();
  $("#pk").onclick = () => { togglePlan(id); $("#dlg").close(); render() };
  $("#ed").onclick = () => editor(r);
  $("#del").onclick = () => { if (confirm(`„${r.name}“ löschen?`)) { S.recipes = S.recipes.filter(x => x.id !== id); S.plan = S.plan.filter(x => x !== id); S.locked = S.locked.filter(x => x !== id); save(); $("#dlg").close(); render() } };
}
function editor(r){
  const e = r || {name:"", portions:2, tags:[], ingredients:[], steps:"", img:""};
  $("#dlg").innerHTML = `<button class="x" id="x" aria-label="Schließen">✕</button><div class="pad"><h2 style="margin-top:0">${r ? "Rezept bearbeiten" : "Neues Rezept"}</h2>
    <div class="row" style="margin-bottom:8px"><input id="en" placeholder="Name" value="${esc(e.name)}" style="flex:1;min-width:180px">
      <label class="mute">Portionen <input id="ep" type="number" min="1" value="${e.portions}" style="width:60px"></label></div>
    <input id="et" placeholder="Kategorien, kommagetrennt (z.B. Pasta, schnell)" value="${esc((e.tags||[]).join(", "))}" style="width:100%;margin-bottom:8px">
    <label class="mute">Zutaten – eine pro Zeile, z.B. „200 g Nudeln“, „2 Zwiebel“, „1 EL Öl“</label>
    <textarea id="ei" placeholder="200 g Nudeln&#10;2 Zwiebel">${esc(e.ingredients.map(ingText).join("\n"))}</textarea>
    <label class="mute">Zubereitung (optional)</label><textarea id="es">${esc(e.steps)}</textarea>
    <div class="row" style="margin-top:8px"><label class="g" style="cursor:pointer;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)"><input type="file" id="eimg" accept="image/*" hidden>📷 ${e.img ? "Foto ändern" : "Foto hinzufügen"}</label><span class="mute" id="imgst">${e.img ? "Foto vorhanden" : "optional"}</span></div>
    <div class="row acts" style="margin-top:14px"><span class="sp"></span><button class="g" id="cx">Abbrechen</button><button class="b main" id="sv">Speichern</button></div></div>`;
  openDlg();
  $("#x").onclick = () => $("#dlg").close();
  let img = e.img || "";
  $("#eimg").onchange = ev => { const f = ev.target.files[0]; if (!f) return;
    const im = new Image(), u = URL.createObjectURL(f);
    im.onload = () => { const c = document.createElement("canvas"), s = Math.min(1, 700 / im.width); c.width = im.width*s; c.height = im.height*s; c.getContext("2d").drawImage(im,0,0,c.width,c.height); img = c.toDataURL("image/jpeg",.75); URL.revokeObjectURL(u); $("#imgst").textContent = "Foto ausgewählt ✓" }; im.src = u };
  $("#cx").onclick = () => $("#dlg").close();
  $("#sv").onclick = () => {
    const name = $("#en").value.trim(); if (!name) return alert("Bitte einen Namen eingeben.");
    const rec = {id: e.id || uid(), name, portions: Math.max(1, +$("#ep").value || 1),
      tags: $("#et").value.split(",").map(s => s.trim()).filter(Boolean),
      ingredients: $("#ei").value.split("\n").map(parseLine).filter(Boolean), steps: $("#es").value.trim(), img, edited: true};
    const i = S.recipes.findIndex(x => x.id === rec.id); i >= 0 ? S.recipes[i] = rec : S.recipes.push(rec);
    save(); $("#dlg").close(); render();
  };
}
/* Dialog öffnen und nach oben scrollen */
function openDlg(){ const d = $("#dlg"); if (!d.open) d.showModal(); d.scrollTop = 0 }

/* Profil & Einstellungen */
function vMe(){
  const cats = new Set(S.recipes.flatMap(r => r.tags || [])).size;
  const installed = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  $("#view").innerHTML = `
    <div class="prof"><div class="ava">🍳</div><div><h2>Mein Kochbuch</h2>
      <div class="stats"><div><b>${S.recipes.length}</b><span>Rezepte</span></div><div><b>${S.plan.length}</b><span>diese Woche</span></div><div><b>${cats}</b><span>Kategorien</span></div></div></div></div>
    <div class="panel"><h3>Planung</h3>
      <div class="set"><div class="t">Kochtage pro Woche<small>So viele Gerichte plant der Wochenplan</small></div>${stepper("days")}</div>
      <div class="set"><div class="t">Personen<small>Danach richten sich alle Mengen</small></div>${stepper("people")}</div>
    </div>
    <div class="panel"><h3>Auf anderes Gerät übertragen</h3>
      <p class="mute">Deine Rezepte, der Wochenplan und die Einkaufsliste sind nur auf diesem Gerät gespeichert. So kommen sie z.&nbsp;B. vom Mac aufs iPhone: am Mac <b>Kopieren</b>, am iPhone <b>Einfügen</b>. Das geht über die gemeinsame Zwischenablage (gleiche Apple-ID, WLAN und Bluetooth an).</p>
      <div class="set"><div class="t">Alles kopieren<small>Rezepte in die Zwischenablage legen</small></div><button class="b" id="cpy">Kopieren</button></div>
      <div class="set"><div class="t">Einfügen<small>Ersetzt die Daten auf diesem Gerät</small></div><button class="g" id="pst">Einfügen</button></div>
    </div>
    <div class="panel"><h3>Backup als Datei</h3>
      <div class="set"><div class="t">Backup speichern<small>Als Datei sichern oder teilen</small></div><button class="g" id="bx">Speichern</button></div>
      <div class="set"><div class="t">Backup laden<small>Ersetzt die Daten auf diesem Gerät</small></div><button class="g" id="bi">Laden</button></div>
    </div>
    ${installed ? "" : `<div class="panel"><h3>Als App installieren</h3>
      <p class="mute">iPhone: In Safari unten auf <b>Teilen</b> (Quadrat mit Pfeil) tippen, dann <b>„Zum Home-Bildschirm“</b>. Danach öffnest du das Kochbuch wie eine App, auch ohne Internet.</p></div>`}
    <p class="mute" style="text-align:center">Mein Kochbuch · funktioniert auch offline</p>`;
  $("#bx").onclick = exportData;
  $("#bi").onclick = importData;
  $("#cpy").onclick = copyData;
  $("#pst").onclick = pasteData;
}
/* Übertragen per Zwischenablage (Mac -> iPhone über die gemeinsame Zwischenablage) */
async function copyData(){
  const text = JSON.stringify(S);
  /* älterer Weg zuerst (geht überall direkt beim Tippen), sonst die moderne Zwischenablage */
  const legacy = () => { const t = document.createElement("textarea"); t.value = text; t.setAttribute("readonly", ""); t.style.cssText = "position:fixed;opacity:0;top:0";
    document.body.append(t); t.select(); t.setSelectionRange(0, text.length); let ok = false; try { ok = document.execCommand("copy") } catch {} t.remove(); return ok };
  let ok = legacy();
  if (!ok) try { await navigator.clipboard.writeText(text); ok = true } catch {}
  if (ok) { $("#cpy").textContent = "Kopiert ✓"; alert(`${S.recipes.length} Rezepte kopiert. Öffne jetzt das Kochbuch auf dem anderen Gerät: Profil → Einfügen.`) }
  else textDlg("Kopieren", "Das automatische Kopieren hat nicht geklappt. Markiere den Text unten komplett und kopiere ihn (Cmd+A, Cmd+C).", text, true);
}
function pasteData(){
  textDlg("Einfügen", "Tippe auf „Aus Zwischenablage“. Falls das nicht geht: lange ins Feld drücken und „Einfügen“ wählen. Danach „Übernehmen“.", "", false);
}
function textDlg(title, hint, text, ro){
  $("#dlg").innerHTML = `<button class="x" id="x" aria-label="Schließen">✕</button><div class="pad">
    <h2 style="margin-top:0">${title}</h2><p class="mute">${hint}</p>
    <textarea id="tx" ${ro ? "readonly" : 'placeholder="Hier einfügen…"'} style="min-height:140px;font-size:13px">${esc(text)}</textarea>
    ${ro ? "" : `<div class="row acts" style="margin-top:12px"><button class="g" id="rd">Aus Zwischenablage</button><button class="b main" id="ok">Übernehmen</button></div>`}</div>`;
  openDlg();
  $("#x").onclick = () => $("#dlg").close();
  if (ro) { $("#tx").focus(); $("#tx").select(); return }
  $("#rd").onclick = async () => { try { $("#tx").value = await navigator.clipboard.readText() } catch { alert("Bitte lange ins Feld drücken und „Einfügen“ wählen.") } };
  $("#ok").onclick = () => applyBackup($("#tx").value);
}
/* Backup-Text prüfen und übernehmen */
function applyBackup(t){
  let d; try { d = JSON.parse(String(t).trim()); if (!Array.isArray(d.recipes)) throw 0 } catch { return alert("Das sieht nicht nach Kochbuch-Daten aus. Hast du am anderen Gerät vorher „Kopieren“ gedrückt?") }
  if (!confirm(`${d.recipes.length} Rezepte übernehmen? Die Daten auf diesem Gerät werden ersetzt.`)) return;
  S = {...S, ...d}; save(); $("#dlg").close(); tab = "recipes"; render();
  alert(`Fertig: ${S.recipes.length} Rezepte sind jetzt auf diesem Gerät.`);
}
async function exportData(){
  const name = `kochbuch-backup-${new Date().toISOString().slice(0,10)}.json`;
  const file = new File([JSON.stringify(S, null, 1)], name, {type: "application/json"});
  /* iPhone/Mac-Safari: Teilen-Menü (AirDrop, „In Dateien sichern“); sonst normaler Download */
  if (navigator.canShare?.({files: [file]})) {
    try { await navigator.share({files: [file], title: "Kochbuch-Backup"}); return }
    catch (e) { if (e.name === "AbortError") return }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
function importData(){
  const i = document.createElement("input"); i.type = "file"; i.hidden = true; document.body.append(i);
  i.onchange = () => { i.files[0] && i.files[0].text().then(applyBackup); i.remove() };
  i.click();
}

/* ---------- Start ---------- */
document.querySelectorAll("nav [data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; scrollTo(0, 0); render() });
$("#add").onclick = () => editor();
/* Plus/Minus-Regler stehen jetzt in den Seiten selbst */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-set]"); if (!b) return;
  const k = b.dataset.set, max = k === "days" ? 14 : 20;
  S[k] = Math.min(max, Math.max(1, S[k] + +b.dataset.d)); save(); render();
});
$("#dlg").onclick = e => { if (e.target === $("#dlg")) $("#dlg").close() };
render();

/* App-Funktionen: offline nutzbar, Daten möglichst dauerhaft behalten */
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
navigator.storage?.persist?.().catch(() => {});
</script>
