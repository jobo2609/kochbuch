<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mein Kochbuch</title>
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kochbuch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<style>
/* ---------- iOS-Stil: Farben wie die Systemfarben von iOS ---------- */
:root{--bg:#f2f2f7;--card:#fff;--card2:#f2f2f7;--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.2);--sep:rgba(60,60,67,.2);--ink:#000;--mute:rgba(60,60,67,.6);--mute2:rgba(60,60,67,.3);
  --acc:#f06a2a;--accf:rgba(240,106,42,.13);--ok:#34c759;--red:#ff3b30;--bar:rgba(249,249,249,.86);--shadow:0 1px 3px rgba(0,0,0,.06);
  --ease:cubic-bezier(.32,.72,0,1);--r:12px}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);--sep:rgba(84,84,88,.6);--ink:#fff;--mute:rgba(235,235,245,.6);--mute2:rgba(235,235,245,.3);
  --acc:#ff8040;--accf:rgba(255,128,64,.2);--ok:#30d158;--red:#ff453a;--bar:rgba(22,22,22,.8);--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button{touch-action:manipulation;font:inherit;color:inherit;-webkit-user-select:none;user-select:none}
.wrap{max-width:720px;margin:auto;padding:0 16px}
.sm,nav .ico{display:none}
ul.clean{list-style:none;margin:0;padding:0}
.mute{color:var(--mute);font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Kopfzeile (Mac/iPad): Titel + Segment-Schalter */
header{position:sticky;top:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
header .wrap{display:flex;align-items:center;gap:16px;height:56px}
.brand{font-weight:700;font-size:17px;white-space:nowrap}
#tb{display:none}
nav{display:flex;gap:2px;background:var(--fill);border-radius:9px;padding:2px;margin-left:auto}
nav button{display:flex;align-items:center;gap:6px;border:0;background:none;border-radius:7px;padding:6px 14px;font-size:14px;font-weight:500;cursor:pointer;position:relative;transition:background .2s,box-shadow .2s}
nav button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
nav .cnt{min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:12px;font-weight:600;text-align:center;padding:0 5px}
nav .cnt:empty{display:none}
nav .plus{order:9;margin-left:8px;background:var(--acc);color:#fff;font-weight:600}
nav .plus .pl{font-size:18px;line-height:1}
main{padding-top:8px;padding-bottom:60px}
@media (max-width:900px){.bt{display:none}}
@media (min-width:701px){nav{position:fixed;top:10px;right:max(16px,calc(50vw - 344px));z-index:21}}

/* Große Titel wie in iOS */
.lt{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.01em;margin:6px 0 2px}
.sub{color:var(--mute);font-size:15px;margin:0 0 14px}
.sh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.02em;margin:22px 16px 7px}
.sf{font-size:13px;color:var(--mute);margin:7px 16px 0;line-height:1.35}

/* Gruppierte Listen */
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 16px;position:relative;background:var(--card);transition:background .25s}
.li + .li::before{content:"";position:absolute;top:0;right:0;left:var(--ins,16px);border-top:.5px solid var(--sep)}
.tap{cursor:pointer}
.tap:active{background:var(--fill2);transition:none}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.li .t small{display:block;color:var(--mute);font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .val{color:var(--mute);white-space:nowrap}
.li .act{color:var(--acc)}
.li .act.red{color:var(--red)}
.chev{color:var(--mute2);flex:none}
.cap{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--acc);margin-bottom:1px}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:var(--r);padding:0 18px;height:50px;font-size:17px;font-weight:600;background:var(--acc);color:#fff;cursor:pointer;transition:transform .15s,opacity .15s}
.btn.gray{background:var(--fill);color:var(--acc)}
.btn.sm2{height:34px;padding:0 14px;font-size:15px;border-radius:999px}
.btn.done{background:var(--ok)}
.btn:active,.ibtn:active,.chip:active,nav button:active{opacity:.6;transform:scale(.97);transition:none}
.btns{display:flex;gap:10px;margin:14px 0 0}
.btns .btn{flex:1}
.ibtn{width:34px;height:34px;flex:none;display:grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--acc);cursor:pointer;transition:transform .15s,opacity .15s}
.ibtn.mute{color:var(--mute2)}
.ibtn.red{color:var(--red)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 4px}

/* Suche und Filter */
.search{display:flex;align-items:center;gap:6px;height:36px;padding:0 8px;background:var(--fill);border-radius:10px;color:var(--mute);margin:4px 0 12px}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:17px;color:var(--ink);padding:0}
.search input::placeholder{color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 16px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--fill);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:15px;cursor:pointer;transition:background .2s,color .2s}
.chip.on{background:var(--acc);color:#fff;font-weight:600}

/* Rezeptzeile */
.thumb{width:56px;height:56px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:28px;overflow:hidden;position:relative;background:linear-gradient(135deg,hsl(var(--h) 75% 90%),hsl(calc(var(--h) + 25) 80% 82%))}
@media (prefers-color-scheme:dark){.thumb,.hero{background:linear-gradient(135deg,hsl(var(--h) 35% 24%),hsl(calc(var(--h) + 25) 40% 17%))}}
.thumb img,.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb.s{width:44px;height:44px;border-radius:10px;font-size:23px}
.rl{--ins:84px}
.addb{width:32px;height:32px;flex:none;border:0;border-radius:50%;display:grid;place-items:center;background:var(--accf);color:var(--acc);cursor:pointer;transition:background .25s,color .25s,transform .15s}
.addb.on{background:var(--acc);color:#fff}
.addb svg{width:18px;height:18px;stroke-width:2.4}
.pop{animation:pop .4s var(--ease)}
@keyframes pop{0%{transform:scale(.6)}55%{transform:scale(1.18)}100%{transform:scale(1)}}

/* Fortschritt */
.prog{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin:0 0 6px}
.prog i{display:block;height:100%;border-radius:3px;background:var(--acc);transition:width .45s var(--ease),background .3s}
.prog.full i{background:var(--ok)}

/* Plus/Minus wie UIStepper */
.step{display:flex;align-items:center;gap:10px}
.step .box{display:flex;align-items:center;background:var(--fill);border-radius:9px;height:32px}
.step button{width:46px;height:32px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--ink);border-radius:9px}
.step button:active{background:var(--fill2)}
.step button + b + button{border-left:0}
.step b{min-width:28px;text-align:center;font-weight:600;font-size:17px}
.step.mini .box{height:28px;border-radius:8px}.step.mini button{width:34px;height:28px;font-size:17px}.step.mini b{min-width:22px;font-size:15px}
.pp{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--mute)}
.pp span{display:flex;align-items:center;gap:4px}.pp .own{color:var(--acc);font-weight:600}

/* Einkaufsliste mit runden Häkchen (wie Erinnerungen) */
.chk{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid var(--mute2);display:grid;place-items:center;transition:background .25s var(--ease),border-color .25s}
.chk svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;transform:scale(0);transition:transform .3s var(--ease)}
.done .chk{background:var(--acc);border-color:var(--acc)}
.done .chk svg{transform:scale(1)}
.shop .t b{font-weight:400;transition:color .25s}
.shop .done .t b{color:var(--mute);text-decoration:line-through}
.shop .done .val{opacity:.5}
.shop .li{--ins:52px}

/* Profil */
.prof{display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 0 4px}
.ava{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:42px;background:linear-gradient(135deg,#f58a4d,#d4511c);box-shadow:var(--shadow)}
.prof h2{margin:10px 0 2px;font-size:22px}
.stats{display:flex;gap:28px;margin-top:10px}
.stats div{line-height:1.2}.stats b{display:block;font-size:20px}.stats span{font-size:13px;color:var(--mute)}

/* Nährwerte */
.kgrid{display:grid;grid-template-columns:repeat(4,1fr)}
.kgrid div{text-align:center;padding:12px 4px;line-height:1.15}
.kgrid div + div{border-left:.5px solid var(--sep)}
.kgrid b{display:block;font-size:20px;font-weight:700}
.kgrid b i{font-style:normal;font-size:13px;font-weight:600;color:var(--mute)}
.kgrid span{font-size:12px;color:var(--mute)}
.kgrid .k b{color:var(--acc)}
.nin{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.nin label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
.nin input{width:100%;height:36px;border:0;border-radius:8px;background:var(--fill);padding:0 8px;font:inherit;font-size:16px;color:var(--ink)}
.nin.w5{grid-template-columns:repeat(5,1fr)}
.nut .li{flex-wrap:wrap;gap:8px}
.nut .t{flex-basis:100%}

/* Formulare */
.fi{width:100%;border:0;background:none;outline:none;font:inherit;font-size:17px;color:var(--ink);padding:0}
.fi::placeholder{color:var(--mute2)}
textarea.fi{min-height:110px;resize:vertical;line-height:1.35}
.li label.t{color:var(--ink)}
.num{width:70px;text-align:right}

/* Leerer Zustand */
.empty{text-align:center;color:var(--mute);padding:56px 20px}
.empty .big{font-size:48px;display:block;margin-bottom:10px}

/* ---------- Blätter (Sheets) ---------- */
dialog{border:0;padding:0;background:var(--bg);color:var(--ink);width:calc(100% - 32px);max-width:560px;max-height:min(88vh,900px);border-radius:14px;overflow:auto;overscroll-behavior:contain;box-shadow:0 24px 80px rgba(0,0,0,.3)}
dialog[open]{animation:popIn .32s var(--ease)}
dialog::backdrop{background:rgba(0,0,0,.4);animation:fade .3s ease}
dialog.closing{animation:popOut .22s ease forwards}
dialog.closing::backdrop{animation:fadeOut .25s ease forwards}
@keyframes popIn{from{opacity:0;transform:scale(.95)}}
@keyframes popOut{to{opacity:0;transform:scale(.96)}}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.pad{padding:16px 16px 24px}
.sheethd{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:56px;padding:0 16px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.sheethd b{font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.sheethd button{border:0;background:none;color:var(--acc);font-size:17px;padding:8px 0;cursor:pointer}
.sheethd button:last-child{justify-self:end;font-weight:600}
.sheethd button:first-child{justify-self:start}
.x{position:sticky;top:12px;float:right;margin:12px 12px -48px 0;z-index:4;width:30px;height:30px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(118,118,128,.24);color:var(--mute);cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.x svg{width:12px;height:12px;stroke-width:3}
.hero{height:200px;display:grid;place-items:center;font-size:76px;position:relative;background:linear-gradient(135deg,hsl(var(--h) 75% 90%),hsl(calc(var(--h) + 25) 80% 82%))}
.dt{font-size:28px;line-height:34px;font-weight:700;margin:0 0 8px}
.tag{display:inline-block;background:var(--fill);color:var(--mute);border-radius:999px;padding:3px 10px;font-size:13px;margin:0 4px 4px 0}
.ing .li{--ins:16px}
.ing .q{min-width:84px;font-weight:600}
.steps{white-space:pre-wrap;line-height:1.45;padding:14px 16px}
.note{background:var(--fill);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:15px}

/* Ansichtswechsel */
.vin{animation:viewIn .32s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}}

/* ---------- iPhone ---------- */
@media (max-width:700px){
  .lg,.desk{display:none!important}
  .sm{display:inline}
  /* Kopfzeile: kleiner Titel erscheint beim Scrollen */
  header{position:fixed;left:0;right:0;top:0;height:44px;background:transparent;border-bottom:.5px solid transparent;-webkit-backdrop-filter:none;backdrop-filter:none;transition:background .25s,border-color .25s}
  header .wrap{height:44px;justify-content:center}
  .brand{display:none}
  #tb{display:block;font-size:17px;font-weight:600;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
  body.scrolled header{background:var(--bar);border-bottom-color:var(--sep);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
  body.scrolled #tb{opacity:1;transform:none}
  main{padding-top:44px;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
  /* Tableiste unten mit Milchglas */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;gap:0;border-radius:0;padding:6px 4px calc(4px + env(safe-area-inset-bottom));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
  nav button{flex:1;flex-direction:column;gap:3px;padding:2px 0;border-radius:0;font-size:10px;font-weight:500;color:var(--mute);background:none!important;box-shadow:none!important}
  nav button.on{color:var(--acc)}
  nav .ico{display:block;width:27px;height:27px}
  nav button.on .ico path,nav button.on .ico rect,nav button.on .ico circle{fill:currentColor;fill-opacity:.18}
  nav .cnt{position:absolute;top:-2px;left:calc(50% + 6px);font-size:12px}
  nav .plus{order:0;margin:0;color:#fff;justify-content:center}
  nav .plus .pl{width:52px;height:36px;border-radius:12px;background:var(--acc);display:grid;place-items:center;font-size:28px;font-weight:300;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 45%,transparent);transition:transform .2s var(--ease)}
  nav .plus:active .pl{transform:scale(.9)}
  /* Blätter kommen von unten */
  dialog{width:100%;max-width:none;max-height:calc(100dvh - 44px);margin:auto 0 0;border-radius:14px 14px 0 0;box-shadow:none}
  dialog[open]{animation:sheetUp .5s var(--ease)}
  dialog.closing{animation:sheetDown .3s cubic-bezier(.4,0,1,1) forwards}
  dialog::before{content:"";position:sticky;top:6px;display:block;width:36px;height:5px;border-radius:3px;background:var(--mute2);margin:6px auto -11px;z-index:5}
  .pad{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .hero{height:180px}
  .nin.w5{grid-template-columns:repeat(4,1fr)}
}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes sheetDown{to{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::backdrop{animation:none!important;transition:none!important}}
@media print{header,nav,.noprint{display:none!important}body{background:#fff}main{padding:0}}
</style>
</head>
<body>
<header><div class="wrap"><span class="brand">🍳<span class="bt"> Mein Kochbuch</span></span><span id="tb"></span></div></header>
<nav>
    <button data-tab="recipes"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 8h7M9 11.5h5"/></svg>Rezepte</button>
    <button data-tab="plan"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M8.5 15l2.2 2.2L15.5 13"/></svg><span class="lg">Wochenplan</span><span class="sm">Woche</span></button>
    <button class="plus" id="add" aria-label="Neues Rezept"><span class="pl">+</span><span class="lg">Neues Rezept</span></button>
    <button data-tab="shop"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3.5h2.6l2.3 11.2a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.2l1.6-6.8H6.2"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg><span class="lg">Einkaufsliste</span><span class="sm">Einkauf</span> <span class="cnt" id="c3"></span></button>
    <button data-tab="me"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Profil</button>
  </nav>

<main id="view" class="wrap"></main>

<dialog id="dlg"></dialog>
<script>
/* ---------- Beispielrezepte (werden nur beim ersten Start geladen) ---------- */
const SEED = [
  {name:"Brokkoli-Käse-Sahne-Sauce",portions:4,tags:["Sauce","vegetarisch möglich"],ingredients:[["Zwiebel",2,"Stk"],["Lauch",1,"Stk"],["Schinkenwürfel / Kochschinken",150,"g"],["Knoblauchzehe",1,"Stk"],["Butter",20,"g"],["Light Sahne",2,"Flasche"],["Frischkäse (oder Schmand)",2,"EL"],["Brokkoli (TK)",500,"g"],["Streukäse (optional)",100,"g"]],steps:"Zwiebeln, Lauch, Schinkenwürfel oder Kochschinken und 1 gepresste Knoblauchzehe in Butter anbraten.\nMit 2 Flaschen Light Sahne und 2 EL Frischkäse (oder Schmand) kurz aufkochen.\nWürzen: Salz, Pfeffer, Muskat, Maggi, Fondor, (Brühe).\nBrokkoli (TK) ca. 10 Minuten in die Mikrowelle geben, dann in kleine Röschen schneiden und in die Sauce geben. Kurz aufkochen lassen.\n(Eventuell etwas Streukäse dazu.)"},

/* ---------- Hilfsfunktionen ---------- */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byId = id => S.recipes.find(r => r.id === id);
const num = v => { v = String(v).trim().replace(",", "."); if (v.includes("/")) { const [a,b] = v.split("/"); return a/b } return parseFloat(v) };
function fmt(qty, unit){
  if (unit === "g" && qty >= 1000) { qty /= 1000; unit = "kg" }
  if (unit === "ml" && qty >= 1000) { qty /= 1000; unit = "l" }
  qty = Math.round(qty * 100) / 100;
  return (qty ? String(qty).replace(".", ",") : "") + (unit ? " " + unit : "");
}
/* "200 g Nudeln" / "1/2 Zwiebel" / "Salz" -> Objekt */
function parseLine(line){
  line = line.trim(); if (!line) return null;
  const m = line.match(/^([\d.,\/]+)\s*([A-Za-zäöüÄÖÜ.]+)?\s+(.+)$/) || line.match(/^([\d.,\/]+)\s*()(.+)$/);
  if (!m) return {name: line, qty: 0, unit: ""};
  let [, q, u, name] = m; u = u || "";
  const known = /^(g|kg|ml|l|cl|el|tl|stk|stk\.|dose|dosen|pck|pck\.|packung|packungen|bund|prise|zehe|zehen|scheibe|scheiben|becher|glas|gläser|ring|flasche|flaschen|handvoll|stange|stangen|beutel|kopf|köpfe)$/i;
  if (u && !known.test(u)) { name = u + " " + name; u = "" }
  const l = u.toLowerCase();
  if (l === "el" || l === "tl") u = l.toUpperCase();
  else if (/^stk/.test(l)) u = "Stk";
  else if (UNITS[l]) u = l;
  else u = {scheiben: "Scheibe", zehen: "Zehe", dosen: "Dose", flaschen: "Flasche", stangen: "Stange", packungen: "Packung", "gläser": "Glas", "köpfe": "Kopf", "pck.": "Pck"}[l] || cap(l);
  return {name: name.trim(), qty: num(q), unit: u};
}
const ingText = i => (i.qty ? fmt(i.qty, i.unit) + " " : "") + i.name;
/* Mengen zum Kochen und Einkaufen sinnvoll aufrunden (die gespeicherten Rezepte bleiben exakt).
   Einkauf: Stück, Gläser usw. auf ganze Packungen; Kochen: auf halbe, bei Glas/Ring/Flasche auf Viertel. */
const up = (x, step) => Math.ceil(x / step - 1e-9) * step;
function nice(qty, unit, shop){
  const u = (unit || "").toLowerCase();
  let q;
  if (/^(g|ml)$/.test(u)) q = qty < 20 ? up(qty, 1) : qty < 200 ? up(qty, 5) : qty < 1000 ? up(qty, 10) : up(qty, 50);
  else if (/^(kg|l)$/.test(u)) q = up(qty, .05);
  else if (/^(el|tl|prise)$/.test(u)) q = up(qty, .5);
  else if (/^(glas|ring|flasche|packung|pck\.?|dose|becher)$/.test(u)) q = shop ? up(qty, 1) : up(qty, .25);
  else q = shop ? up(qty, 1) : up(qty, .5);   /* Stk, Stange, Zehe, Bund, Scheibe, Handvoll, ohne Einheit */
  return fmt(q, unit);
}

  [/miracel whip balance|miracle whip balance/, 200, {Glas: 500}, 0.5, 11, 17.5], [/miracel whip|miracle whip|mayo/, 360, {Glas: 500}, 1, 12, 34],
  [/ketchup/, 110, {}, 1.2, 25, 0.2], [/senf/, 100, {}, 6, 5, 6], [/soja/, 60, {}, 8, 6, 0.1], [/worcester/, 80, {}, 0, 19, 0], [/sriracha/, 95, {}, 2, 19, 1],
  [/balsamico/, 90, {}, 0.5, 17, 0], [/essig/, 20, {}, 0, 0.6, 0], [/honig/, 305, {EL: 20}, 0.4, 82, 0], [/zucker|sirup/, 390, {}, 0, 98, 0],
  [/brühwürfel/, 200, {Stk: 10}, 8, 20, 12], [/brühe/, 5, {}, 0.3, 0.5, 0.2], [/rotwein|weißwein|wein/, 70, {}, 0.1, 2.6, 0]
];
/* Gewicht allgemeiner Einheiten in g (Flüssiges: 1 ml ≈ 1 g) */
const UNIT_G = {g: 1, kg: 1000, ml: 1, l: 1000, cl: 10, EL: 15, TL: 5, Prise: .5, Handvoll: 30, Bund: 30, Scheibe: 25, Becher: 200, Glas: 400, Flasche: 250, Packung: 400, Dose: 400, Ring: 500, Stange: 100, Zehe: 4, Pck: 400, "Pck.": 400};
const cap = u => u ? u[0].toUpperCase() + u.slice(1) : "";
/* Wert für eine Zutat: eigene Angabe vor eingebauter Tabelle */
function nutriOf(name){
  const n = name.toLowerCase().trim(), own = (S.nutri || {})[n];
  const hit = NUTRI.find(([re]) => re.test(n));
  return {k: own?.k ?? hit?.[1], p: own?.p ?? hit?.[3], c: own?.c ?? hit?.[4], f: own?.f ?? hit?.[5], g: {...(hit?.[2] || {}), ...(own?.g || {})}, own: !!own};
}
/* Gramm einer Zutatenmenge, oder null wenn unbekannt */
function gramsOf(i){
  const u = i.unit || "Stk", nu = nutriOf(i.name);
  let per = nu.g[u] ?? nu.g[cap(u)] ?? UNIT_G[u] ?? UNIT_G[u.toLowerCase()] ?? UNIT_G[cap(u.toLowerCase())];
  if (per == null) return null;
  if (/\bklein/i.test(i.name) && /Stk|Stange/.test(u)) per *= .6;
  if (/\bgroß/i.test(i.name) && /Stk|Stange/.test(u) && !/porree/i.test(i.name)) per *= 1.5;
  return i.qty * per;
}
/* Nährwerte eines Rezepts: gesamt, pro Portion, pro 100 g und was fehlt.
   Hat das Rezept eigene Werte (r.own, je 100 g), gelten diese. */
function kcalOf(r){
  const t = {k: 0, p: 0, c: 0, f: 0}; let grams = 0; const miss = [];
  for (const i of r.ingredients) {
    if (!i.qty) continue;
    const nu = nutriOf(i.name), g = gramsOf(i);
    if (nu.k == null || g == null) { miss.push(i.name); continue }
    for (const x of "kpcf") t[x] += g * (nu[x] || 0) / 100;
    grams += g;
  }
  const n = r.portions || 1, o = r.own;
  if (o && o.k != null) {
    const pg = grams / n;   /* Portionsgewicht aus den Zutaten, falls bekannt */
    const per100 = {k: o.k, p: o.p ?? 0, c: o.c ?? 0, f: o.f ?? 0};
    const portion = pg ? Object.fromEntries(Object.entries(per100).map(([x, v]) => [x, v * pg / 100])) : null;
    return {own: true, total: 1, per100, portion: portion ? portion.k : (o.portion || 0), per: portion, miss: []};
  }
  const per100 = grams ? Object.fromEntries(Object.entries(t).map(([x, v]) => [x, v / grams * 100])) : {k: 0, p: 0, c: 0, f: 0};
  const per = Object.fromEntries(Object.entries(t).map(([x, v]) => [x, v / n]));
  return {own: false, total: t.k, per100, portion: t.k / n, per, miss};
}
const r10 = x => Math.round(x / 10) * 10;
const kcalTxt = r => { const c = kcalOf(r); return c.portion > 0 ? `🔥 ${r10(c.portion)} kcal` : "" };

/* ---------- Plan-Logik ---------- */
function randomize(){
  const keep = S.plan.filter(id => S.locked.includes(id) && byId(id));
  let pool = S.recipes.map(r => r.id).filter(id => !keep.includes(id));
  const need = Math.max(0, S.days - keep.length);
  const picked = [];
  while (picked.length < need && pool.length) picked.push(pool.splice(Math.floor(Math.random()*pool.length), 1)[0]);
  // zu wenige Rezepte: wiederholen erlaubt, aber erst nachdem alle einmal dran waren
  while (picked.length < need && S.recipes.length) picked.push(S.recipes[Math.floor(Math.random()*S.recipes.length)].id);
  S.plan = [...keep, ...picked]; S.checked = {}; save();
}
/* Personen je Gericht: eigene Zahl fürs Gericht, sonst die allgemeine Einstellung */
const servOf = id => (S.servings || {})[id] ?? S.people;
function togglePlan(id){
  if (S.plan.includes(id)) { S.plan = S.plan.filter(x => x !== id); S.locked = S.locked.filter(x => x !== id); if (S.servings) delete S.servings[id] }
  else S.plan.push(id);
  S.checked = {}; save();
}
function shopping(){
  const map = {};
  for (const id of S.plan) {
    const r = byId(id); if (!r) continue;
    const f = servOf(id) / (r.portions || 1);
    for (const i of r.ingredients) {
      let qty = (i.qty || 0) * f, unit = i.unit || "";
      const u = UNITS[unit.toLowerCase()]; if (u) { qty *= u[1]; unit = u[0] }
      const key = i.name.trim().toLowerCase() + "|" + unit;
      (map[key] ||= {name: i.name.trim(), unit, qty: 0, from: []});
      map[key].qty += qty; map[key].from.push(r.name);
    }
  }
  return Object.entries(map).map(([key, v]) => ({key, ...v})).sort((a,b) => a.name.localeCompare(b.name, "de"));
}

function kcalBox(r){
  const c = kcalOf(r), h = c.per100, ok = c.total > 0;
  const cell = (v, unit, lab, cls = "") => `<div class="${cls}"><b>${ok ? v : "–"}<i>${unit}</i></b><span>${lab}</span></div>`;
  return `<div class="sh"><span>Nährwerte pro 100 g</span>${c.own ? `<span style="color:var(--acc);text-transform:none">eigene Angabe</span>` : ""}</div>
    <div class="list"><div class="kgrid">${cell(Math.round(h.k), "", "kcal", "k")}${cell(g1(h.c), " g", "Kohlenhydrate")}${cell(g1(h.p), " g", "Eiweiß")}${cell(g1(h.f), " g", "Fett")}</div>
    ${ok && c.per ? `<div class="li"><span class="t">Portion</span><span class="val" style="font-size:15px">${r10(c.per.k)} kcal · ${Math.round(c.per.c)} KH · ${Math.round(c.per.p)} EW · ${Math.round(c.per.f)} F</span></div>` : ""}
    <div class="li tap" id="kc"><span class="t act">${c.miss.length ? "Fehlende Werte eintragen" : "Werte ansehen oder ändern"}</span>${ic("chev", "chev")}</div></div>
    <p class="sf">${c.miss.length ? `Noch ohne Wert: ${c.miss.map(esc).join(", ")}` : c.own ? "Von dir für dieses Rezept eingetragen." : "Richtwerte, berechnet aus den Zutaten (roh)."}</p>`;
}
/* Kopfzeile eines Blatts wie in iOS: links abbrechen, Mitte Titel, rechts bestätigen */
const sheetHd = (left, title, right) => `<div class="sheethd"><button id="hl">${left}</button><b>${title}</b>${right ? `<button id="hr">${right}</button>` : "<span></span>"}</div>`;
/* Nährwerte ansehen und ändern: fürs ganze Rezept oder je Zutat (gilt dann für alle Rezepte mit dieser Zutat) */
function nutriDlg(r){
  const o = r.own || {}, c = kcalOf(r);
  const inp = (cls, v, ph = "") => `<input type="number" inputmode="decimal" class="${cls}" value="${v ?? ""}" placeholder="${ph}">`;
  const rows = r.ingredients.filter(i => i.qty).map(i => {
    const nu = nutriOf(i.name), u = i.unit || "Stk", weight = /^(g|kg|ml|l|cl)$/i.test(u);
    const per = weight ? null : (nu.g[u] ?? nu.g[cap(u)] ?? UNIT_G[u] ?? UNIT_G[cap(u.toLowerCase())] ?? "");
    return `<div class="li" data-name="${esc(i.name)}" data-u="${esc(u)}"><span class="t"><b>${esc(i.name)}</b><small>${fmt(i.qty, i.unit) || i.qty}${nu.own ? " · eigene Werte" : ""}</small></span>
      <div class="nin ${weight ? "" : "w5"}"><label>kcal${inp("k", nu.k, "?")}</label><label>KH g${inp("c", nu.c, "?")}</label><label>Eiweiß g${inp("p", nu.p, "?")}</label><label>Fett g${inp("f", nu.f, "?")}</label>
      ${weight ? "" : `<label>g pro ${esc(u)}${inp("w", per, "?")}</label>`}</div></div>`;
  }).join("");
  $("#dlg").innerHTML = `${sheetHd("Zurück", "Nährwerte", "Sichern")}<div class="pad">
    <div class="sh" style="margin-top:4px"><span>Ganzes Rezept, pro 100 g</span></div>
    <div class="list ownbox"><div class="li"><div class="nin"><label>kcal${inp("ok", o.k, Math.round(c.own ? "" : c.per100.k) || "")}</label><label>KH g${inp("oc", o.c)}</label><label>Eiweiß g${inp("op", o.p)}</label><label>Fett g${inp("of", o.f)}</label></div></div></div>
    <p class="sf">Z.&nbsp;B. aus einer Nährwert-App. Leer lassen, dann wird aus den Zutaten gerechnet.</p>
    <div class="sh"><span>Oder je Zutat, pro 100 g</span></div>
    <div class="list nut">${rows}</div>
    <p class="sf">Eingebaute Richtwerte, die du ändern kannst, z.&nbsp;B. mit den Angaben von der Packung. Gilt für alle Rezepte mit dieser Zutat.</p></div>`;
  openDlg();
  $("#hl").onclick = () => detail(r.id);
  $("#hr").onclick = () => {
    /* ganzes Rezept */
    const ov = {k: num($(".ownbox .ok").value), c: num($(".ownbox .oc").value), p: num($(".ownbox .op").value), f: num($(".ownbox .of").value)};
    if (!isNaN(ov.k)) r.own = Object.fromEntries(Object.entries(ov).filter(([, v]) => !isNaN(v))); else delete r.own;
    /* je Zutat: nur speichern, was vom eingebauten Wert abweicht */
    S.nutri ||= {};
    document.querySelectorAll(".nut [data-name]").forEach(li => {
      const name = li.dataset.name.toLowerCase().trim(), u = li.dataset.u, hit = NUTRI.find(([re]) => re.test(name));
      const base = {k: hit?.[1], p: hit?.[3], c: hit?.[4], f: hit?.[5]}, own = {...(S.nutri[name] || {})};
      for (const x of "kcpf") { const v = num(li.querySelector("." + x).value);
        if (!isNaN(v) && v !== base[x]) own[x] = v; else delete own[x] }
      const wEl = li.querySelector(".w");
      if (wEl) { const w = num(wEl.value), bw = hit?.[2]?.[u] ?? UNIT_G[u];
        if (!isNaN(w) && w !== bw) own.g = {...(own.g || {}), [u]: w}; else if (own.g) { delete own.g[u]; if (!Object.keys(own.g).length) delete own.g } }
      if (Object.keys(own).length) S.nutri[name] = own; else delete S.nutri[name];
    });
    save(); detail(r.id); render();
  };
}
function detail(id){
  const r = byId(id), n = servOf(id), f = n / (r.portions || 1), sel = S.plan.includes(id);
  $("#dlg").innerHTML = `<button class="x" id="x" aria-label="Schließen">${ic("x")}</button>${hero(r)}<div class="pad">
    <h2 class="dt">${esc(r.name)}</h2>
    <div>${(r.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
    <button class="btn ${sel ? "done" : ""}" id="pk" style="width:100%;margin-top:12px">${ic(sel ? "check" : "plus")} ${sel ? "Eingeplant – entfernen" : "In die Woche"}</button>
    ${kcalBox(r)}
    <div class="sh"><span>Zutaten für ${n} Person${n === 1 ? "" : "en"}</span><span style="text-transform:none">Rezept: ${r.portions}</span></div>
    <div class="list" style="margin-bottom:10px"><div class="li"><span class="t">Personen${n !== S.people ? ` <small style="display:inline;color:var(--acc)">· eigene Zahl</small>` : ""}</span>${stepper("sv:" + id)}</div></div>
    <div class="list ing">${r.ingredients.map(i => `<div class="li"><span class="q">${i.qty ? nice(i.qty*f, i.unit) : (i.unit || "–")}</span><span class="t">${esc(i.name)}</span></div>`).join("")}</div>
    ${r.steps ? `<div class="sh"><span>Zubereitung</span></div><div class="list"><div class="steps">${esc(r.steps)}</div></div>` : ""}
    <div class="list" style="margin-top:22px"><div class="li tap" id="ed"><span class="t act">Bearbeiten</span>${ic("pencil", "chev")}</div><div class="li tap" id="del"><span class="t act red">Rezept löschen</span>${ic("trash", "chev")}</div></div></div>`;
  openDlg();
  $("#x").onclick = closeDlg;
  $("#pk").onclick = () => { togglePlan(id); closeDlg(); render() };
  $("#ed").onclick = () => editor(r);
  $("#kc").onclick = () => nutriDlg(r);
  $("#del").onclick = () => { if (confirm(`„${r.name}“ löschen?`)) { S.recipes = S.recipes.filter(x => x.id !== id); S.plan = S.plan.filter(x => x !== id); S.locked = S.locked.filter(x => x !== id); save(); closeDlg(); render() } };
}
function editor(r){
  const e = r || {name:"", portions:2, tags:[], ingredients:[], steps:"", img:""};
  $("#dlg").innerHTML = `${sheetHd("Abbrechen", r ? "Bearbeiten" : "Neues Rezept", "Sichern")}<div class="pad">
    <div class="list" style="margin-top:4px">
      <div class="li"><input class="fi" id="en" placeholder="Name des Gerichts" value="${esc(e.name)}"></div>
      <div class="li"><span class="t">Portionen</span><input class="fi num" id="ep" type="number" inputmode="numeric" min="1" value="${e.portions}"></div>
      <div class="li"><input class="fi" id="et" placeholder="Kategorien, z. B. Pasta, schnell" value="${esc((e.tags||[]).join(", "))}"></div>
    </div>
    <div class="sh"><span>Zutaten</span></div>
    <div class="list"><div class="li"><textarea class="fi" id="ei" placeholder="200 g Nudeln&#10;2 Zwiebel&#10;1 EL Öl">${esc(e.ingredients.map(ingText).join("\n"))}</textarea></div></div>
    <p class="sf">Eine Zutat pro Zeile, z.&nbsp;B. „200 g Nudeln“, „2 Zwiebel“, „1 EL Öl“.</p>
    <div class="sh"><span>Zubereitung</span></div>
    <div class="list"><div class="li"><textarea class="fi" id="es" placeholder="Optional">${esc(e.steps)}</textarea></div></div>
    <div class="list" style="margin-top:22px"><label class="li tap"><input type="file" id="eimg" accept="image/*" hidden><span class="t act">${e.img ? "Foto ändern" : "Foto hinzufügen"}</span><span class="val" id="imgst">${e.img ? "vorhanden" : "optional"}</span></label></div></div>`;
  openDlg();
  $("#hl").onclick = closeDlg;
  let img = e.img || "";
  $("#eimg").onchange = ev => { const f = ev.target.files[0]; if (!f) return;
    const im = new Image(), u = URL.createObjectURL(f);
    im.onload = () => { const c = document.createElement("canvas"), s = Math.min(1, 700 / im.width); c.width = im.width*s; c.height = im.height*s; c.getContext("2d").drawImage(im,0,0,c.width,c.height); img = c.toDataURL("image/jpeg",.75); URL.revokeObjectURL(u); $("#imgst").textContent = "ausgewählt ✓" }; im.src = u };
  $("#hr").onclick = () => {
    const name = $("#en").value.trim(); if (!name) return alert("Bitte einen Namen eingeben.");
    const rec = {id: e.id || uid(), name, portions: Math.max(1, +$("#ep").value || 1),
      tags: $("#et").value.split(",").map(s => s.trim()).filter(Boolean),
      ingredients: $("#ei").value.split("\n").map(parseLine).filter(Boolean), steps: $("#es").value.trim(), img, edited: true, ...(e.own ? {own: e.own} : {})};
    const i = S.recipes.findIndex(x => x.id === rec.id); i >= 0 ? S.recipes[i] = rec : S.recipes.push(rec);
    save(); closeDlg(); render();
  };
}
/* ---------- Blatt öffnen/schließen mit Animation, Wischen nach unten schließt ---------- */
const dlg = $("#dlg"); let closeT = 0;
function openDlg(){ clearTimeout(closeT); dlg.classList.remove("closing"); dlg.style.transform = ""; if (!dlg.open) dlg.showModal(); dlg.scrollTop = 0 }
function closeDlg(){
  if (!dlg.open || dlg.classList.contains("closing")) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return dlg.close();
  dlg.classList.add("closing");
  closeT = setTimeout(() => { dlg.classList.remove("closing"); dlg.style.transform = ""; dlg.close() }, 280);
}
dlg.addEventListener("cancel", e => { e.preventDefault(); closeDlg() });
dlg.addEventListener("click", e => { if (e.target === dlg) { const b = dlg.getBoundingClientRect(); if (e.clientY < b.top || e.clientY > b.bottom || e.clientX < b.left || e.clientX > b.right) closeDlg() } });
{
  let y0 = null, dy = 0;
  dlg.addEventListener("touchstart", e => { y0 = innerWidth <= 700 && dlg.scrollTop <= 0 && !e.target.closest("input,textarea") ? e.touches[0].clientY : null; dy = 0 }, {passive: true});
  dlg.addEventListener("touchmove", e => {
    if (y0 == null) return; dy = e.touches[0].clientY - y0;
    if (dy > 0) { e.preventDefault(); dlg.style.transition = "none"; dlg.style.transform = `translateY(${dy}px)` } else { y0 = null; dlg.style.transform = "" }
  }, {passive: false});
  dlg.addEventListener("touchend", () => { if (y0 == null) return; y0 = null; dlg.style.transition = "transform .35s var(--ease)";
    if (dy > 110) closeDlg(); else dlg.style.transform = "" });
}

/* Profil & Einstellungen */
function vMe(){
  const cats = new Set(S.recipes.flatMap(r => r.tags || [])).size;
  const installed = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  $("#view").innerHTML = `
    <h1 class="lt">Profil</h1>
    <div class="prof"><div class="ava">🍳</div><h2>Mein Kochbuch</h2>
      <div class="stats"><div><b>${S.recipes.length}</b><span>Rezepte</span></div><div><b>${S.plan.length}</b><span>diese Woche</span></div><div><b>${cats}</b><span>Kategorien</span></div></div></div>
    <div class="sh"><span>Planung</span></div>
    <div class="list">
      <div class="li"><span class="t">Kochtage pro Woche</span>${stepper("days")}</div>
      <div class="li"><span class="t">Personen</span>${stepper("people")}</div>
    </div>
    <p class="sf">Der Wochenplan plant so viele Gerichte. Alle Mengen werden auf die Personenzahl umgerechnet.</p>
    <div class="sh"><span>Auf anderes Gerät übertragen</span></div>
    <div class="list">
      <div class="li tap" id="cpy"><span class="t act">Alles kopieren</span>${ic("copy", "chev")}</div>
      <div class="li tap" id="pst"><span class="t act">Einfügen</span>${ic("chev", "chev")}</div>
    </div>
    <p class="sf">Deine Daten sind nur auf diesem Gerät gespeichert. Vom Mac aufs iPhone: am Mac „Alles kopieren“, am iPhone „Einfügen“. Das geht über die gemeinsame Zwischenablage (gleiche Apple-ID, WLAN und Bluetooth an). „Einfügen“ ersetzt die Daten auf diesem Gerät.</p>
    <div class="sh"><span>Backup als Datei</span></div>
    <div class="list">
      <div class="li tap" id="bx"><span class="t act">Backup speichern</span>${ic("share", "chev")}</div>
      <div class="li tap" id="bi"><span class="t act">Backup laden</span>${ic("chev", "chev")}</div>
    </div>
    ${installed ? "" : `<div class="sh"><span>Als App installieren</span></div>
      <div class="list"><div class="li"><span class="t" style="font-size:15px;line-height:1.4">In Safari unten auf <b style="display:inline">Teilen</b> tippen, dann <b style="display:inline">„Zum Home-Bildschirm“</b>. Danach öffnest du das Kochbuch wie eine App, auch ohne Internet.</span></div></div>`}
    <p class="sf" style="text-align:center;margin-top:24px">Mein Kochbuch · funktioniert auch offline</p>`;
  $("#bx").onclick = exportData;
  $("#bi").onclick = importData;
  $("#cpy").onclick = copyData;
  $("#pst").onclick = pasteData;
}
/* Übertragen per Zwischenablage (Mac -> iPhone über die gemeinsame Zwischenablage) */
async function copyData(){
  const text = JSON.stringify(S);
  /* älterer Weg zuerst (geht überall direkt beim Tippen), sonst die moderne Zwischenablage */
  const legacy = () => { const t = document.createElement("textarea"); t.value = text; t.setAttribute("readonly", ""); t.style.cssText = "position:fixed;opacity:0;top:0";
    document.body.append(t); t.select(); t.setSelectionRange(0, text.length); let ok = false; try { ok = document.execCommand("copy") } catch {} t.remove(); return ok };
  let ok = legacy();
  if (!ok) try { await navigator.clipboard.writeText(text); ok = true } catch {}
  if (ok) { $("#cpy .t").textContent = "Kopiert ✓"; alert(`${S.recipes.length} Rezepte kopiert. Öffne jetzt das Kochbuch auf dem anderen Gerät: Profil → Einfügen.`) }
  else textDlg("Kopieren", "Das automatische Kopieren hat nicht geklappt. Markiere den Text unten komplett und kopiere ihn (Cmd+A, Cmd+C).", text, true);
}
function pasteData(){
  textDlg("Einfügen", "Tippe auf „Aus Zwischenablage“. Falls das nicht geht: lange ins Feld drücken und „Einfügen“ wählen. Danach „Übernehmen“.", "", false);
}
function textDlg(title, hint, text, ro){
  $("#dlg").innerHTML = `${sheetHd(ro ? "Fertig" : "Abbrechen", title, ro ? "" : "Übernehmen")}<div class="pad">
    <p class="sf" style="margin:4px 16px 8px">${hint}</p>
    <div class="list"><div class="li"><textarea class="fi" id="tx" ${ro ? "readonly" : 'placeholder="Hier einfügen…"'} style="min-height:160px;font-size:13px">${esc(text)}</textarea></div></div>
    ${ro ? "" : `<button class="btn gray" id="rd" style="width:100%;margin-top:14px">Aus Zwischenablage einfügen</button>`}</div>`;
  openDlg();
  $("#hl").onclick = closeDlg;
  if (ro) { $("#tx").focus(); $("#tx").select(); return }
  $("#rd").onclick = async () => { try { $("#tx").value = await navigator.clipboard.readText() } catch { alert("Bitte lange ins Feld drücken und „Einfügen“ wählen.") } };
  $("#hr").onclick = () => applyBackup($("#tx").value);
}
/* Backup-Text prüfen und übernehmen */
function applyBackup(t){
  let d; try { d = JSON.parse(String(t).trim()); if (!Array.isArray(d.recipes)) throw 0 } catch { return alert("Das sieht nicht nach Kochbuch-Daten aus. Hast du am anderen Gerät vorher „Kopieren“ gedrückt?") }
  if (!confirm(`${d.recipes.length} Rezepte übernehmen? Die Daten auf diesem Gerät werden ersetzt.`)) return;
  S = {...S, ...d}; save(); closeDlg(); tab = "recipes"; render();
  alert(`Fertig: ${S.recipes.length} Rezepte sind jetzt auf diesem Gerät.`);
}
async function exportData(){
  const name = `kochbuch-backup-${new Date().toISOString().slice(0,10)}.json`;
  const file = new File([JSON.stringify(S, null, 1)], name, {type: "application/json"});
  /* iPhone/Mac-Safari: Teilen-Menü (AirDrop, „In Dateien sichern“); sonst normaler Download */
  if (navigator.canShare?.({files: [file]})) {
    try { await navigator.share({files: [file], title: "Kochbuch-Backup"}); return }
    catch (e) { if (e.name === "AbortError") return }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
function importData(){
  const i = document.createElement("input"); i.type = "file"; i.hidden = true; document.body.append(i);
  i.onchange = () => { i.files[0] && i.files[0].text().then(applyBackup); i.remove() };
  i.click();
}

/* ---------- Start ---------- */
document.querySelectorAll("nav [data-tab]").forEach(b => b.onclick = () => { if (tab === b.dataset.tab) { scrollTo({top: 0, behavior: "smooth"}); return } tab = b.dataset.tab; scrollTo(0, 0); render(); onScroll() });
$("#add").onclick = () => editor();
/* Plus/Minus-Regler stehen in den Seiten selbst */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-set]"); if (!b) return;
  const k = b.dataset.set, d = +b.dataset.d;
  if (k.startsWith("sv:")) {   /* Personen für ein einzelnes Gericht */
    const id = k.slice(3), v = Math.min(30, Math.max(1, servOf(id) + d));
    S.servings ||= {}; if (v === S.people) delete S.servings[id]; else S.servings[id] = v;
    save(); if (dlg.open && $("#pk")) detail(id); render(); return;
  }
  const max = k === "days" ? 14 : 30;
  S[k] = Math.min(max, Math.max(1, S[k] + d)); save(); render();
});
document.addEventListener("click", e => { const a = e.target.closest("[data-gotab]"); if (!a) return; e.preventDefault(); tab = a.dataset.gotab; scrollTo(0, 0); render() });
/* großer Titel wird beim Scrollen zum kleinen Titel in der Kopfzeile (wie in iOS) */
const onScroll = () => document.body.classList.toggle("scrolled", scrollY > 40);
addEventListener("scroll", onScroll, {passive: true});
render();

/* App-Funktionen: offline nutzbar, Daten möglichst dauerhaft behalten */
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
navigator.storage?.persist?.().catch(() => {});
</script>
