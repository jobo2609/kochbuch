<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mein Kochbuch</title>
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kochbuch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<style>
/* ---------- iOS-Stil: Farben wie die Systemfarben von iOS ---------- */
:root{--bg:#f2f2f7;--card:#fff;--card2:#f2f2f7;--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.2);--sep:rgba(60,60,67,.2);--ink:#000;--mute:rgba(60,60,67,.6);--mute2:rgba(60,60,67,.3);
  --acc:#c2410c;--accf:rgba(194,65,12,.12);--onacc:#fff;--ok:#34c759;--red:#ff3b30;--bar:rgba(249,249,249,.86);--shadow:0 1px 3px rgba(0,0,0,.06);
  --ease:cubic-bezier(.32,.72,0,1);--r:12px}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);--sep:rgba(84,84,88,.6);--ink:#fff;--mute:rgba(235,235,245,.6);--mute2:rgba(235,235,245,.3);
  --acc:#ff8a4c;--accf:rgba(255,138,76,.2);--onacc:#000;--ok:#30d158;--red:#ff453a;--bar:rgba(22,22,22,.8);--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:1rem}
/* Schrift wächst mit der iPhone-Einstellung „Textgröße“ (nur auf Touch-Geräten, am Mac wäre sie sonst zu klein) */
@supports (font:-apple-system-body){@media (hover:none) and (pointer:coarse){html{font:-apple-system-body}}}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button{touch-action:manipulation;font:inherit;color:inherit;-webkit-user-select:none;user-select:none}
.wrap{max-width:720px;margin:auto;padding:0 16px}
.sm,nav .ico{display:none}
ul.clean{list-style:none;margin:0;padding:0}
.mute{color:var(--mute);font-size:0.882rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Kopfzeile (Mac/iPad): Titel + Segment-Schalter */
header{position:sticky;top:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
header .wrap{display:flex;align-items:center;gap:16px;height:56px}
.brand{font-weight:700;font-size:1rem;white-space:nowrap}
#tb{display:none}
nav{display:flex;gap:2px;background:var(--fill);border-radius:9px;padding:2px;margin-left:auto}
nav button{display:flex;align-items:center;gap:6px;border:0;background:none;border-radius:7px;padding:6px 14px;font-size:0.824rem;font-weight:500;cursor:pointer;position:relative;transition:background .2s,box-shadow .2s}
nav button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
nav .cnt{min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:0.706rem;font-weight:600;text-align:center;padding:0 5px}
nav .cnt:empty{display:none}
nav .plus{order:9;margin-left:8px;background:var(--acc);color:var(--onacc);font-weight:600}
nav .plus .pl{font-size:1.059rem;line-height:1}
main.wrap{padding-top:8px;padding-bottom:60px}
@media (max-width:900px){.bt{display:none}}
@media (min-width:701px){nav{position:fixed;top:10px;right:max(16px,calc(50vw - 344px));z-index:21}}

/* Große Titel wie in iOS */
.lt{font-size:2rem;line-height:1.2;font-weight:700;letter-spacing:.01em;margin:6px 0 2px}
.sub{color:var(--mute);font-size:0.882rem;margin:0 0 14px}
.sh{display:flex;justify-content:space-between;align-items:baseline;font-size:0.765rem;color:var(--mute);text-transform:uppercase;letter-spacing:.02em;margin:22px 16px 7px}
.sf{font-size:0.765rem;color:var(--mute);margin:7px 16px 0;line-height:1.35}

/* Gruppierte Listen */
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 16px;position:relative;background:var(--card);transition:background .25s}
.li + .li::before{content:"";position:absolute;top:0;right:0;left:var(--ins,16px);border-top:.5px solid var(--sep)}
.tap{cursor:pointer}
.tap:active{background:var(--fill2);transition:none}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.li .t small{display:block;color:var(--mute);font-size:0.882rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .val{color:var(--mute);white-space:nowrap}
.li .val.warn{color:var(--red);font-weight:600}
.li .act{color:var(--acc)}
.li .act.red{color:var(--red)}
.chev{color:var(--mute2);flex:none}
.cap{display:block;font-size:0.706rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--acc);margin-bottom:1px}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:var(--r);padding:0 18px;height:50px;font-size:1rem;font-weight:600;background:var(--acc);color:var(--onacc);cursor:pointer;transition:transform .15s,opacity .15s}
.btn.gray{background:var(--fill);color:var(--acc)}
.btn.sm2{height:34px;padding:0 14px;font-size:0.882rem;border-radius:999px}
.btn.done{background:var(--ok)}
.btn:active,.ibtn:active,.chip:active,nav button:active{opacity:.6;transform:scale(.97);transition:none}
.btns{display:flex;gap:10px;margin:14px 0 0}
.btns .btn{flex:1}
.ibtn{width:44px;height:44px;flex:none;display:grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--acc);cursor:pointer;transition:transform .15s,opacity .15s}
.ibtn.mute{color:var(--mute2)}
.ibtn.red{color:var(--red)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 4px}

/* Suche und Filter */
.search{display:flex;align-items:center;gap:6px;height:36px;padding:0 8px;background:var(--fill);border-radius:10px;color:var(--mute);margin:4px 0 12px}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:1rem;color:var(--ink);padding:0}
.search input::placeholder{color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 16px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--fill);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:0.882rem;cursor:pointer;transition:background .2s,color .2s}
.chip.on{background:var(--acc);color:var(--onacc);font-weight:600}

/* Rezeptzeile */
.thumb{width:56px;height:56px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:1.647rem;overflow:hidden;position:relative;background:linear-gradient(135deg,hsl(var(--h) 75% 90%),hsl(calc(var(--h) + 25) 80% 82%))}
@media (prefers-color-scheme:dark){.thumb,.hero{background:linear-gradient(135deg,hsl(var(--h) 35% 24%),hsl(calc(var(--h) + 25) 40% 17%))}}
.thumb img,.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb.s{width:44px;height:44px;border-radius:10px;font-size:1.353rem}
.rl{--ins:84px}
.addb{width:32px;height:32px;flex:none;border:0;border-radius:50%;display:grid;place-items:center;background:var(--accf);color:var(--acc);cursor:pointer;transition:background .25s,color .25s,transform .15s}
.addb.on{background:var(--acc);color:var(--onacc)}
.addb svg{width:18px;height:18px;stroke-width:2.4}
.pop{animation:pop .4s var(--ease)}
@keyframes pop{0%{transform:scale(.6)}55%{transform:scale(1.18)}100%{transform:scale(1)}}

/* Fortschritt */
.prog{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin:0 0 6px}
.prog i{display:block;height:100%;border-radius:3px;background:var(--acc);transition:width .45s var(--ease),background .3s}
.prog.full i{background:var(--ok)}

/* Plus/Minus wie UIStepper */
.step{display:flex;align-items:center;gap:10px}
.step .box{display:flex;align-items:center;background:var(--fill);border-radius:9px;height:32px}
.step button{width:46px;height:32px;border:0;background:none;font-size:1.176rem;cursor:pointer;color:var(--ink);border-radius:9px}
.step button:active{background:var(--fill2)}
.step button + b + button{border-left:0}
.step b{min-width:28px;text-align:center;font-weight:600;font-size:1rem}
.step.mini .box{height:28px;border-radius:8px}.step.mini button{width:34px;height:28px;font-size:1rem}.step.mini b{min-width:22px;font-size:0.882rem}
.pp{display:flex;align-items:center;gap:8px;font-size:0.765rem;color:var(--mute)}
.wk{flex-wrap:wrap;row-gap:2px}
.wka{flex-basis:100%;display:flex;align-items:center;gap:0;min-width:0}
.pp span{display:flex;align-items:center;gap:4px}.pp .own{color:var(--acc);font-weight:600}

/* Einkaufsliste mit runden Häkchen (wie Erinnerungen) */
.chk{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid var(--mute2);display:grid;place-items:center;transition:background .25s var(--ease),border-color .25s}
.chk svg{width:14px;height:14px;stroke:var(--onacc);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;transform:scale(0);transition:transform .3s var(--ease)}
.done .chk{background:var(--acc);border-color:var(--acc)}
.done .chk svg{transform:scale(1)}
.shop .t b{font-weight:400;transition:color .25s}
.shop .done .t b{color:var(--mute);text-decoration:line-through}
.shop .done .val{opacity:.5}
.shop .li{--ins:52px}
.li + .li::before{z-index:2}
.sw{padding:0;overflow:hidden;transition:height .3s var(--ease),opacity .25s}
.sw.gone{height:0!important;opacity:0}
.swc{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:10px 16px;background:var(--card);position:relative;z-index:1;transition:transform .35s var(--ease),background .25s}
.sw.tap:active .swc{background:color-mix(in srgb,var(--card),#8e8e93 16%);transition:transform .35s var(--ease)}
.swas{position:absolute;right:0;top:0;bottom:0;display:flex}
.swa2{width:88px;border:0;background:var(--acc);color:var(--onacc);font-weight:600;font-size:0.882rem;cursor:pointer}
.swa2.gray{background:#636366;color:#fff}.swa2.red{background:#d70015;color:#fff}
.hov{display:none;gap:6px}
.pop2 .swc{animation:flash 1.4s ease}
@keyframes flash{0%,30%{background:var(--accf)}100%{background:var(--card)}}
.havebtn{display:none;border:0;background:var(--fill);color:var(--acc);border-radius:999px;padding:4px 10px;font-size:0.765rem;cursor:pointer;opacity:0;transition:opacity .2s}
@media (hover:hover){.hov{display:inline-flex}.havebtn{display:inline-block}.sw:hover .havebtn{opacity:1}.swas{display:none}}

/* Profil */
.prof{display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 0 4px}
.ava{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:2.471rem;background:linear-gradient(135deg,#f58a4d,#d4511c);box-shadow:var(--shadow)}
.prof h2{margin:10px 0 2px;font-size:1.294rem}
.stats{display:flex;gap:28px;margin-top:10px}
.stats div{line-height:1.2}.stats b{display:block;font-size:1.176rem}.stats span{font-size:0.765rem;color:var(--mute)}

/* Nährwerte */
.kgrid{display:grid;grid-template-columns:repeat(4,1fr)}
.kgrid div{text-align:center;padding:12px 4px;line-height:1.15}
.kgrid div + div{border-left:.5px solid var(--sep)}
.kgrid b{display:block;font-size:1.176rem;font-weight:700}
.kgrid b i{font-style:normal;font-size:0.765rem;font-weight:600;color:var(--mute)}
.kgrid span{font-size:0.706rem;color:var(--mute)}
.kgrid .k b{color:var(--acc)}
.nin{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.nin label{display:flex;flex-direction:column;gap:3px;font-size:0.706rem;color:var(--mute)}
.nin input{width:100%;height:36px;border:0;border-radius:8px;background:var(--fill);padding:0 8px;font:inherit;font-size:0.941rem;color:var(--ink)}
.nin.w5{grid-template-columns:repeat(5,1fr)}
.nut .li{flex-wrap:wrap;gap:8px}
.nut .t{flex-basis:100%}

/* Formulare */
.fi{width:100%;border:0;background:none;outline:none;font:inherit;font-size:1rem;color:var(--ink);padding:0}
.fi::placeholder{color:var(--mute2)}
textarea.fi{min-height:110px;resize:vertical;line-height:1.35}
.li label.t{color:var(--ink)}
.num{width:70px;text-align:right}

/* Leerer Zustand */
.empty{text-align:center;color:var(--mute);padding:56px 20px}
.empty .big{font-size:2.824rem;display:block;margin-bottom:10px}

/* ---------- Blätter (Sheets) ---------- */
dialog{border:0;padding:0;background:var(--bg);color:var(--ink);width:calc(100% - 32px);max-width:560px;max-height:min(88vh,900px);border-radius:14px;overflow:auto;overscroll-behavior:contain;box-shadow:0 24px 80px rgba(0,0,0,.3)}
dialog[open]{animation:popIn .32s var(--ease)}
dialog::backdrop{background:rgba(0,0,0,.4);animation:fade .3s ease}
dialog.closing{animation:popOut .22s ease forwards}
dialog.closing::backdrop{animation:fadeOut .25s ease forwards}
@keyframes popIn{from{opacity:0;transform:scale(.95)}}
@keyframes popOut{to{opacity:0;transform:scale(.96)}}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.pad{padding:16px 16px 24px}
.sheethd{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:56px;padding:0 16px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.sheethd b{font-size:1rem;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.sheethd button{border:0;background:none;color:var(--acc);font-size:1rem;padding:8px 0;cursor:pointer}
.sheethd button:last-child{justify-self:end;font-weight:600}
.sheethd button:first-child{justify-self:start}
.x{position:sticky;top:12px;float:right;margin:12px 12px -48px 0;z-index:4;width:30px;height:30px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(118,118,128,.24);color:var(--mute);cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.x svg{width:12px;height:12px;stroke-width:3}
.hero{height:200px;display:grid;place-items:center;font-size:4.471rem;position:relative;background:linear-gradient(135deg,hsl(var(--h) 75% 90%),hsl(calc(var(--h) + 25) 80% 82%))}
.dt{font-size:1.647rem;line-height:34px;font-weight:700;margin:0 0 8px}
.tag{display:inline-block;background:var(--fill);color:var(--mute);border-radius:999px;padding:3px 10px;font-size:0.765rem;margin:0 4px 4px 0}
.ing .li{--ins:16px}
.ing .q{min-width:84px;font-weight:600}
.steps{white-space:pre-wrap;line-height:1.45;padding:14px 16px}
.note{background:var(--fill);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:0.882rem}

/* Ansichtswechsel */
.vin{animation:viewIn .32s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}}

/* ---------- iPhone ---------- */
@media (max-width:700px){
  .lg,.desk{display:none!important}
  .sm{display:inline}
  /* Kopfzeile: kleiner Titel erscheint beim Scrollen */
  header{position:fixed;left:0;right:0;top:0;height:44px;background:transparent;border-bottom:.5px solid transparent;-webkit-backdrop-filter:none;backdrop-filter:none;transition:background .25s,border-color .25s}
  header .wrap{height:44px;justify-content:center}
  .brand{display:none}
  #tb{display:block;font-size:1rem;font-weight:600;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
  body.scrolled header{background:var(--bar);border-bottom-color:var(--sep);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
  body.scrolled #tb{opacity:1;transform:none}
  main.wrap{padding-top:44px;padding-bottom:calc(max(var(--navh, 90px), 90px) + env(safe-area-inset-bottom) + 40px)}
  /* Tableiste unten mit Milchglas */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;gap:0;border-radius:0;padding:6px 4px calc(4px + env(safe-area-inset-bottom));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
  nav button{flex:1;flex-direction:column;gap:3px;padding:2px 0;border-radius:0;font-size:0.588rem;font-weight:500;color:var(--mute);background:none!important;box-shadow:none!important}
  nav button.on{color:var(--acc)}
  nav .ico{display:block;width:27px;height:27px}
  nav button.on .ico path,nav button.on .ico rect,nav button.on .ico circle{fill:currentColor;fill-opacity:.18}
  nav .cnt{position:absolute;top:-2px;left:calc(50% + 6px);font-size:0.706rem}
  nav .plus{order:0;margin:0;color:var(--onacc);justify-content:center}
  nav .plus .pl{width:52px;height:36px;border-radius:12px;background:var(--acc);display:grid;place-items:center;font-size:1.647rem;font-weight:300;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 45%,transparent);transition:transform .2s var(--ease)}
  nav .plus:active .pl{transform:scale(.9)}
  /* Blätter kommen von unten */
  dialog{width:100%;max-width:none;max-height:calc(100dvh - 44px);margin:auto 0 0;border-radius:14px 14px 0 0;box-shadow:none}
  dialog[open]{animation:sheetUp .5s var(--ease)}
  dialog.closing{animation:sheetDown .3s cubic-bezier(.4,0,1,1) forwards}
  dialog::before{content:"";position:sticky;top:6px;display:block;width:36px;height:5px;border-radius:3px;background:var(--mute2);margin:6px auto -11px;z-index:5}
  .pad{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .hero{height:180px}
  .nin.w5{grid-template-columns:repeat(4,1fr)}
}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes sheetDown{to{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::backdrop{animation:none!important;transition:none!important}}
@media print{header,nav,.noprint{display:none!important}body{background:#fff}main{padding:0}}
</style>
</head>
<body>
<header><div class="wrap"><span class="brand">🍳<span class="bt"> Mein Kochbuch</span></span><span id="tb"></span></div></header>
<nav>
    <button data-tab="recipes"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 8h7M9 11.5h5"/></svg>Rezepte</button>
    <button data-tab="plan"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M8.5 15l2.2 2.2L15.5 13"/></svg><span class="lg">Wochenplan</span><span class="sm">Woche</span></button>
    <button class="plus" id="add" aria-label="Neues Rezept"><span class="pl">+</span><span class="lg">Neues Rezept</span></button>

/* ---------- Hilfsfunktionen ---------- */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byId = id => S.recipes.find(r => r.id === id);
const num = v => { v = String(v).trim().replace(",", "."); if (v.includes("/")) { const [a,b] = v.split("/"); return a/b } return parseFloat(v) };
function fmt(qty, unit){
  if (unit === "g" && qty >= 1000) { qty /= 1000; unit = "kg" }
  if (unit === "ml" && qty >= 1000) { qty /= 1000; unit = "l" }
  qty = Math.round(qty * 100) / 100;
  return (qty ? String(qty).replace(".", ",") : "") + (unit ? " " + unit : "");
}
/* "200 g Nudeln", "500 Gramm Hack", "2-3 Karotten", "1 1/2 TL Salz", "½ Zwiebel", "Salz" -> Objekt */
const FRAC = {"½": .5, "¼": .25, "¾": .75, "⅓": 1/3, "⅔": 2/3, "⅛": .125};
const UNIT_WORDS = [
  [/^(g|gr|gramm)$/, "g"], [/^(kg|kilo|kilogramm)$/, "kg"], [/^(ml|milliliter)$/, "ml"], [/^(l|liter)$/, "l"], [/^(cl|zentiliter)$/, "cl"],
  [/^(el|essl|esslöffel)$/, "EL"], [/^(tl|teel|teelöffel)$/, "TL"], [/^(stk|st|stück|stücke)$/, "Stk"], [/^(prise|prisen|msp|messerspitze)$/, "Prise"],
  [/^(dose|dosen)$/, "Dose"], [/^(pck|pkg|päckchen|packung|packungen)$/, "Packung"], [/^(bund|bünde)$/, "Bund"], [/^(zehe|zehen)$/, "Zehe"],
  [/^(scheibe|scheiben)$/, "Scheibe"], [/^(becher)$/, "Becher"], [/^(glas|gläser)$/, "Glas"], [/^(ring|ringe)$/, "Ring"], [/^(flasche|flaschen)$/, "Flasche"],
  [/^(handvoll)$/, "Handvoll"], [/^(stange|stangen)$/, "Stange"], [/^(beutel)$/, "Beutel"], [/^(kopf|köpfe)$/, "Kopf"], [/^(tasse|tassen)$/, "Tasse"]
];
const unitWord = w => { w = w.toLowerCase().replace(/\.$/, ""); const hit = UNIT_WORDS.find(([re]) => re.test(w)); return hit ? hit[1] : null };
/* eine Zahl wie "2", "1,5", "1/2", "1 1/2", "1½", "½" */
const qnum = t => { t = t.trim(); let v = 0;
  for (const part of t.split(/\s+/)) { const fr = part.match(/^(\d*)([½¼¾⅓⅔⅛])$/);
    v += fr ? (+fr[1] || 0) + FRAC[fr[2]] : part.includes("/") ? (([a, b]) => a / b)(part.split("/").map(Number)) : parseFloat(part.replace(",", ".")) }
  return v };
function parseLine(line){
  line = line.trim().replace(/^(ca\.?|circa|etwa|ungefähr)\s+/i, ""); if (!line) return null;
  const NUM = "(?:\\d*[½¼¾⅓⅔⅛]|\\d+\\/\\d+|\\d+(?:[.,]\\d+)?(?:\\s+\\d+\\/\\d+)?)";
  const m = line.match(new RegExp(`^(${NUM})(?:\\s*(?:-|–|bis)\\s*(${NUM}))?\\s*(.*)$`));
  if (!m || !m[3]) return {name: line, qty: 0, unit: ""};
  /* bei "2-3" die größere Zahl nehmen, damit genug eingekauft wird */
  const qty = Math.max(qnum(m[1]), m[2] ? qnum(m[2]) : 0);
  let rest = m[3].trim(), unit = "";
  const w = rest.match(/^([A-Za-zäöüÄÖÜß]+\.?)\s+(.+)$/);
  if (w && unitWord(w[1])) { unit = unitWord(w[1]); rest = w[2] }
  else { const glued = rest.match(/^(g|kg|ml|l|el|tl)\b\.?\s*(.+)$/i); if (glued) { unit = unitWord(glued[1]); rest = glued[2] } }
  return {name: rest.trim(), qty, unit};
}
const ingText = i => (i.qty ? fmt(i.qty, i.unit) + " " : "") + i.name;
/* Mengen zum Kochen und Einkaufen sinnvoll aufrunden (die gespeicherten Rezepte bleiben exakt).
   Einkauf: Stück, Gläser usw. auf ganze Packungen; Kochen: auf halbe, bei Glas/Ring/Flasche auf Viertel. */
const up = (x, step) => Math.ceil(x / step - 1e-9) * step;
function nice(qty, unit, shop){
  const u = (unit || "").toLowerCase();
  let q;
  if (/^(g|ml)$/.test(u)) q = qty < 20 ? up(qty, 1) : qty < 200 ? up(qty, 5) : qty < 1000 ? up(qty, 10) : up(qty, 50);
  else if (/^(kg|l)$/.test(u)) q = up(qty, .05);
  else if (/^(el|tl|prise)$/.test(u)) q = up(qty, .5);
  else if (/^(glas|ring|flasche|packung|pck\.?|dose|becher)$/.test(u)) q = shop ? up(qty, 1) : up(qty, .25);
  else q = shop ? up(qty, 1) : up(qty, .5);   /* Stk, Stange, Zehe, Bund, Scheibe, Handvoll, ohne Einheit */
  return fmt(q, unit);
}

/* Gewicht allgemeiner Einheiten in g (Flüssiges: 1 ml ≈ 1 g) */
const UNIT_G = {g: 1, kg: 1000, ml: 1, l: 1000, cl: 10, EL: 15, TL: 5, Prise: .5, Handvoll: 30, Bund: 30, Scheibe: 25, Becher: 200, Glas: 400, Flasche: 250, Packung: 400, Dose: 400, Ring: 500, Stange: 100, Zehe: 4, Pck: 400, "Pck.": 400};
const cap = u => u ? u[0].toUpperCase() + u.slice(1) : "";
/* Wert für eine Zutat: eigene Angabe vor eingebauter Tabelle */
function nutriOf(name){
  const n = name.toLowerCase().trim(), own = (S.nutri || {})[n];
  const hit = NUTRI.find(([re]) => re.test(n));
  return {k: own?.k ?? hit?.[1], p: own?.p ?? hit?.[3], c: own?.c ?? hit?.[4], f: own?.f ?? hit?.[5], g: {...(hit?.[2] || {}), ...(own?.g || {})}, own: !!own};
}
/* Gramm einer Zutatenmenge, oder null wenn unbekannt */
function gramsOf(i){
  const u = i.unit || "Stk", nu = nutriOf(i.name);
  let per = nu.g[u] ?? nu.g[cap(u)] ?? UNIT_G[u] ?? UNIT_G[u.toLowerCase()] ?? UNIT_G[cap(u.toLowerCase())];
  if (per == null) return null;
  if (/\bklein/i.test(i.name) && /Stk|Stange/.test(u)) per *= .6;
  if (/\bgroß/i.test(i.name) && /Stk|Stange/.test(u) && !/porree/i.test(i.name)) per *= 1.5;
  return i.qty * per;
}
/* Nährwerte eines Rezepts: gesamt, pro Portion, pro 100 g und was fehlt.
   Hat das Rezept eigene Werte (r.own, je 100 g), gelten diese. */
function kcalOf(r){
  const t = {k: 0, p: 0, c: 0, f: 0}; let grams = 0; const miss = [];
  for (const i of r.ingredients) {
    if (!i.qty) continue;
    const nu = nutriOf(i.name), g = gramsOf(i);
    if (nu.k == null || g == null) { miss.push(i.name); continue }
    for (const x of "kpcf") t[x] += g * (nu[x] || 0) / 100;
    grams += g;
  }
  const n = r.portions || 1, o = r.own;
  if (o && o.k != null) {
    const pg = grams / n;   /* Portionsgewicht aus den Zutaten, falls bekannt */
    const per100 = {k: o.k, p: o.p ?? 0, c: o.c ?? 0, f: o.f ?? 0};
    const portion = pg ? Object.fromEntries(Object.entries(per100).map(([x, v]) => [x, v * pg / 100])) : null;
    return {own: true, total: 1, per100, portion: portion ? portion.k : (o.portion || 0), per: portion, miss: []};
  }
  const per100 = grams ? Object.fromEntries(Object.entries(t).map(([x, v]) => [x, v / grams * 100])) : {k: 0, p: 0, c: 0, f: 0};
  const per = Object.fromEntries(Object.entries(t).map(([x, v]) => [x, v / n]));
  return {own: false, total: t.k, per100, portion: t.k / n, per, miss};
}
const r10 = x => Math.round(x / 10) * 10;
const kcalTxt = r => { const c = kcalOf(r); return c.portion > 0 ? `🔥 ${r10(c.portion)} kcal` : "" };

/* ---------- Plan-Logik ---------- */
function randomize(){
  const keep = S.plan.filter(id => S.locked.includes(id) && byId(id));
  let pool = S.recipes.map(r => r.id).filter(id => !keep.includes(id));
  const need = Math.max(0, S.days - keep.length);
  const picked = [];
  while (picked.length < need && pool.length) picked.push(pool.splice(Math.floor(Math.random()*pool.length), 1)[0]);
  // zu wenige Rezepte: wiederholen erlaubt, aber erst nachdem alle einmal dran waren
  while (picked.length < need && S.recipes.length) picked.push(S.recipes[Math.floor(Math.random()*S.recipes.length)].id);
  S.plan = [...keep, ...picked]; newWeek(); save();
}
/* neue Woche (Würfeln/Leeren): „Hab ich“ und ausgeblendete Einkäufe gelten nicht mehr */
function newWeek(){ S.have = {}; S.bought = {} }
/* Personen je Gericht: eigene Zahl fürs Gericht, sonst die allgemeine Einstellung */
const servOf = id => (S.servings || {})[id] ?? S.people;
function togglePlan(id){
  if (S.plan.includes(id)) { S.plan = S.plan.filter(x => x !== id); S.locked = S.locked.filter(x => x !== id); if (S.servings) delete S.servings[id] }
  else S.plan.push(id);
  save();
}
/* gleiche Zutat erkennen: "Zwiebeln", "Zwiebel", "Zwiebel (klein)" -> "zwiebel" */
const PLURAL = {"äpfel": "apfel", "nüsse": "nuss", "eier": "ei", "möhren": "möhre"};
const sing = w => PLURAL[w] || (w.length < 5 || /(chen|lein)$/.test(w) ? w : /(eln|ern)$/.test(w) ? w.slice(0, -1) : /en$/.test(w) && !/(ien|aen)$/.test(w) ? w.slice(0, -1) : /(as|os|ons)$/.test(w) ? w.slice(0, -1) : w);
const normName = n => n.toLowerCase().replace(/\(.*?\)/g, " ").replace(/\s+/g, " ").trim().split(" ").map(sing).join(" ");
function shopping(){
  const map = {};
  for (const id of S.plan) {
    const r = byId(id); if (!r) continue;
    const f = servOf(id) / (r.portions || 1);
    for (const i of r.ingredients) {
      let qty = (i.qty || 0) * f, unit = i.unit || (i.qty ? "Stk" : "");
      const u = UNITS[unit.toLowerCase()]; if (u) { qty *= u[1]; unit = u[0] }
      const key = normName(i.name) + "|" + unit;
      (map[key] ||= {name: i.name.trim(), unit, qty: 0, from: []});
      map[key].qty += qty; map[key].from.push(r.name);
    }
  }
  return Object.entries(map).map(([key, v]) => ({key, ...v})).sort((a,b) => a.name.localeCompare(b.name, "de"));
}

/* Fotos liegen in IndexedDB (viel mehr Platz als der normale Browser-Speicher); r.img = "idb" */
const imgs = {};

let dbP = null;
const idb = (mode, fn) => (dbP ||= new Promise((ok, no) => { const q = indexedDB.open("kochbuch", 1); q.onupgradeneeded = () => q.result.createObjectStore("img"); q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error) }))
  .then(db => new Promise((ok, no) => { const t = db.transaction("img", mode), q = fn(t.objectStore("img")); t.oncomplete = () => ok(q && q.result); t.onerror = () => no(t.error) }));
/* Fotos, die noch im normalen Speicher liegen (alte Rezepte, Backups), nach IndexedDB umziehen */
async function moveImages(){
  let moved = false;
  for (const r of S.recipes) if (r.img && r.img.startsWith("data:")) {
    try { await idb("readwrite", st => st.put(r.img, r.id)); imgs[r.id] = r.img; r.img = "idb"; moved = true } catch { break }
  }
  return moved;
}
async function initImages(){
  try {
    const moved = await moveImages();
    const [vals, keys] = await Promise.all([idb("readonly", st => st.getAll()), idb("readonly", st => st.getAllKeys())]);
    keys.forEach((k, i) => { if (k !== "__vorher") imgs[k] = vals[i] });
    if (moved) save();
    render();
  } catch { /* ohne IndexedDB bleiben Fotos im normalen Speicher */ }
}

/* Wischen nach links wie in iOS-Listen */
let openRow = null;
function closeSwipe(row){ row.classList.remove("open"); row.querySelector(".swc").style.transform = ""; if (openRow === row) openRow = null }
function swipeRow(row){
  const c = row.querySelector(".swc"), W = 176; let x0 = null, y0 = 0, dx = 0, drag = false;
  row.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; drag = false; dx = 0; if (openRow && openRow !== row) closeSwipe(openRow) }, {passive: true});
  row.addEventListener("touchmove", e => {
    if (x0 == null) return;
    const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
    if (!drag) { if (Math.abs(mx) > 8 && Math.abs(mx) > Math.abs(my)) { drag = true; c.style.transition = "none" } else if (Math.abs(my) > 8) { x0 = null; return } else return }
    e.preventDefault(); dx = Math.min(0, mx - (row.classList.contains("open") ? W : 0)); c.style.transform = `translateX(${dx}px)`;
  }, {passive: false});
  row.addEventListener("touchend", () => {
    if (!drag) return; drag = false; c.style.transition = ""; row._swiped = true; setTimeout(() => row._swiped = false, 60);
    if (dx < -W / 2) { row.classList.add("open"); c.style.transform = `translateX(-${W}px)`; openRow = row } else closeSwipe(row);
  });
}

const MEAT = /hack|hähnchen|huhn|chicken|pute|rind|schwein|kalb|lamm|schinken|speck|bacon|wurst|lyoner|salami|chorizo|fleisch|lachs|thunfisch|fisch|garnele|shrimp|scampi|krabbe|sardelle/;
const CAT_RULES = [
  ["Suppe", (n) => /suppe|eintopf|chili con|brühe$/.test(n)],
  ["Salat", (n) => /salat/.test(n)],
  ["Bowl", (n) => /bowl/.test(n)],
  ["Auflauf", (n) => /auflauf|gratin|lasagne|\bpie\b|überbacken|moussaka/.test(n)],
  ["Sauce", (n) => /sauce|soße|sosse|\bdip\b|pesto/.test(n)],
  ["Pasta", (n, z) => /spaghetti|nudel|pasta|penne|lasagne|tagliatelle|makkaroni|fusilli|gnocchi|tortellini|ravioli/.test(n + " " + z.replace(/suppennudel\w*/g, ""))],
  ["Reis", (n, z) => /(?<!p)reis|risotto/.test(n + " " + z)],
  ["Hack", (n, z) => /hack/.test(n + " " + z)],
  ["Hähnchen", (n, z) => /hähnchen|huhn|chicken|pute/.test(n + " " + z)],
  ["Fisch", (n, z) => /lachs|thunfisch|fisch|garnele|shrimp|scampi/.test(n + " " + z)],
  ["Airfryer", (n, z, st) => /airfryer|heißluftfritteuse/.test(n + " " + st)],
  ["Frühstück", (n) => /müsli|porridge|overnight|pancake|pfannkuchen|omelett|rührei|frühstück/.test(n)],
  ["Dessert", (n) => /kuchen|dessert|pudding|mousse|tiramisu|crumble|muffin|brownie|waffel/.test(n)],
  ["vegetarisch", (n, z) => z.trim() && !MEAT.test(n + " " + z)],
  ["schnell", (n, z, st) => /schnell|express|blitz|mikrowelle/.test(n)]
];
function autoTags(name, ingText, steps){
  const n = name.toLowerCase(), z = ingText.toLowerCase(), st = steps.toLowerCase();
  const known = new Map(S.recipes.flatMap(r => r.tags || []).map(t => [t.toLowerCase(), t]));
  return CAT_RULES.filter(([, test]) => test(n, z, st)).map(([t]) => known.get(t.toLowerCase()) || t);
}

async function copyData(){

  const legacy = () => { const t = document.createElement("textarea"); t.value = text; t.setAttribute("readonly", ""); t.style.cssText = "position:fixed;opacity:0;top:0";
    document.body.append(t); t.select(); t.setSelectionRange(0, text.length); let ok = false; try { ok = document.execCommand("copy") } catch {} t.remove(); return ok };

  if (!ok) try { await navigator.clipboard.writeText(text); ok = true } catch {}
  if (ok) { S.lastBackup = Date.now(); save(); $("#cpy .t").textContent = "Kopiert ✓"; alert(`${S.recipes.length} Rezepte kopiert. Öffne jetzt das Kochbuch auf dem anderen Gerät: Profil → Einfügen.`) }

  }
  const max = k === "days" ? 14 : 30;
  S[k] = Math.min(max, Math.max(1, S[k] + d)); save(); render();
});
document.addEventListener("click", e => { const a = e.target.closest("[data-gotab]"); if (!a) return; e.preventDefault(); tab = a.dataset.gotab; scrollTo(0, 0); render() });
/* großer Titel wird beim Scrollen zum kleinen Titel in der Kopfzeile (wie in iOS) */
const onScroll = () => document.body.classList.toggle("scrolled", scrollY > 40);
addEventListener("scroll", onScroll, {passive: true});
render();
initImages();

/* App-Funktionen: offline nutzbar, Daten möglichst dauerhaft behalten */
/* Updates: beim Öffnen und beim Zurückkehren in die App nach einer neuen Version schauen;
   ist eine da, lädt die Seite einmal neu, damit man sie sofort sieht. */
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded && !dlg.open) { reloaded = true; location.reload() } });
  navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).then(reg => {
    reg.update().catch(() => {});
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}) });
  }).catch(() => {});
}
/* Abstand unten = echte Höhe der Leiste (inkl. Home-Balken), damit nichts verdeckt wird */
const setNavH = () => document.documentElement.style.setProperty("--navh", $("nav").getBoundingClientRect().height + "px");
setNavH(); addEventListener("resize", setNavH); new ResizeObserver(setNavH).observe($("nav"));
navigator.storage?.persist?.().catch(() => {});
</script>
